/* Schede riassuntive: r = regole (pt, con <b>), e = esempi in italiano, t = trappola */
const SCHEDE = {
101:{r:['<b>ce, ci</b> = "tch" · <b>che, chi</b> = "k" · <b>ge, gi</b> = "dj" · <b>ghe, ghi</b> = "g"','<b>gli</b> = "lh" · <b>gn</b> = "nh" · <b>sce, sci</b> = "ch" (de chá)','Consoantes <b>duplas</b> mudam o sentido: nono ≠ nonno','Vogais finais claras: latte = "lát-te", nunca "látchi"','<b>tu</b> com amigos · <b>Lei</b> (verbo na 3ª pessoa) com desconhecidos'],e:['Ciao! Mi chiamo Ana.','Buongiorno, come sta?','Di dove sei? Sono brasiliana.','Piacere! — Piacere mio.'],t:'Buongiorno vale até o começo da tarde; depois, Buonasera. Buonanotte só para dormir.'},
102:{r:['<b>essere</b>: sono, sei, è, siamo, siete, sono','<b>avere</b>: ho, hai, ha, abbiamo, avete, hanno (h mudo)','Adjetivos em -o/-a/-i/-e; em -e só -e/-i (gentile, gentili)','Idade e sensações com <b>avere</b>: ho 30 anni, ho fame, ho freddo','Profissão: sono insegnante · faccio l\'insegnante'],e:['Ho trentadue anni.','Mia sorella è alta e simpatica.','Hai fame? — No, ho sete.','Loro sono francesi.'],t:'Nunca "sono 30 anni" nem "sono con fame".'},
103:{r:['-o → -i (libro, libri) · -a → -e (casa, case) · -e → -i (fiore, fiori)','Acento final e consoante não mudam: le città, i caffè, i bar','<b>il</b> / <b>lo</b> (s+consoante, z) / <b>l\'</b> (vogal) / <b>la</b>','Plurais: i, gli, le · indefinidos: un, uno, una, un\'','-ca → -che (amiche) · -co → -chi (giochi), mas amici'],e:['il libro → i libri','lo studente → gli studenti','l\'amica → le amiche','la mano → le mani'],t:'Gênero diferente do português: il fiore, il ponte, il colore, il latte.'},
104:{r:['-are: parlo, parli, parla, parliamo, parlate, parlano','-ere: prendo, prendi, prende, prendiamo, prendete, prendono','-ire: dormo… · -isc-: capisco, capisci, capisce, capiamo, capite, capiscono','tu sempre em <b>-i</b>, noi sempre em <b>-iamo</b>','Negação: <b>non</b> + verbo; non… mai, non… niente'],e:['Non capisco questa parola.','Dove abiti?','Cerchi lavoro? (cercare → cerchi)','Loro PAR-la-no italiano.'],t:'"loro parlano" tem acento na antepenúltima: PAR-la-no, não par-LA-no.'},
105:{r:['vado, vengo, faccio, sto, esco, dico (+ formas na lição)','voglio, posso, devo, so + <b>infinitivo sem preposição</b>','vorrei = gostaria (mais educado que voglio)','andare <b>a</b> + cidade/infinitivo · <b>in</b> + país/transporte · <b>a</b> piedi','fare colazione, fare la spesa, fa caldo'],e:['Voglio imparare l\'italiano.','Stasera non posso uscire.','Vado in Italia in treno.','Che cosa fai domenica?'],t:'sapere = saber (fatos, habilidades) · conoscere = conhecer (pessoas, lugares).'},
106:{r:['Sono le tre · È l\'una · È mezzogiorno','e un quarto, e mezza, meno un quarto','A che ora? Alle otto · all\'una','Dias e meses com minúscula; il lunedì = toda segunda','Reflexivos: mi sveglio, ti alzi, si veste, ci divertiamo'],e:['Mi sveglio alle sette.','Il film comincia alle nove e mezza.','Il mio compleanno è il 12 marzo.','Non vado mai in palestra.'],t:'ventuno, ventotto (sem vogal); ventitré com acento.'},
107:{r:['<b>c\'è</b> + singular · <b>ci sono</b> + plural = há','Dov\'è…? para algo conhecido','vicino a, lontano da, davanti a, accanto a, di fronte a','Indicações com Lei: vada dritto, giri a destra, prenda…'],e:['C\'è una farmacia qui vicino?','Ci sono tre bar nella piazza.','Scusi, dov\'è la stazione?','Vada dritto e giri a sinistra.'],t:'"Ci è" não existe: c\'è. E com plural, ci sono.'},
109:{r:['<b>di</b>: posse, origem com essere, material, conteúdo','<b>a</b>: cidades, casa/scuola/letto, horas, pessoas, a + infinitivo','<b>in</b>: países, regiões, banca/ufficio/farmacia, transporte','<b>da</b>: vengo da, casa de alguém, "há" + tempo que continua, finalidade','tra/fra = daqui a · fa = há (passado)'],e:['Abito a Lisbona da due anni.','Vado dal medico.','Lavoro in banca.','Un bicchiere di vino / un bicchiere da vino.'],t:'Moro em Lisboa → abito A Lisbona · Estou em casa → sono A casa.'},
108:{r:['O que agrada é o sujeito: mi <b>piace</b> + singular/infinitivo, mi <b>piacciono</b> + plural','mi, ti, gli, le, Le, ci, vi, gli + piace','A Marco piace… (com nome, use a)','Anche a me (eu também) · Neanche a me (eu também não)','questo / quello (quel, quello, quell\', quei, quegli)'],e:['Mi piace il caffè.','Mi piacciono i musei.','Vorrei un cappuccino, per favore.','Il conto, per favore.'],t:'"Gosto de café" → Mi piace il caffè (sem di, com artigo).'},
1:{r:['di/a/da/in/su + artigo = del, al, dal, nel, sul…','Profissionais e pessoas: vado <b>dal</b> medico, <b>da</b> Marco','<b>in</b> sem artigo: in banca, in ufficio, in centro','Partitivo: del pane, degli amici (= um pouco de, alguns)','Possessivo com artigo, exceto parentes no singular: mia madre'],e:['Le chiavi sono sul tavolo.','Vado dal dentista.','Vorrei del pane.','I miei fratelli · mia sorella'],t:'"lo" é artigo masculino (lo zio), não pronome neutro.'},
2:{r:['passato prossimo = avere/essere + particípio','<b>essere</b>: movimento, mudança de estado, reflexivos, piacere','Com essere o particípio concorda: Maria è andata','Com avere não concorda (salvo pronomes)','Irregulares: fatto, detto, scritto, preso, messo, visto…'],e:['Ieri sono andata al cinema.','Abbiamo mangiato troppo.','Mi è piaciuto il film.','Le ragazze si sono divertite.'],t:'"Ho andato" ✗ → sono andata/o.'},
3:{r:['<b>imperfetto</b>: cenário, hábito, ação em curso','<b>passato prossimo</b>: fato concluído, interrupção','trapassato: avevo/ero + particípio (passado do passado)','sapevo (já sabia) ≠ ho saputo (fiquei sabendo)','Duração até hoje: presente + da'],e:['Da bambina andavo al mare.','Mentre cucinavo, è arrivato Paolo.','Quando sono arrivata, il treno era già partito.','Conosco Marco da dieci anni.'],t:'"Conosco Paolo da anni", nunca "ho conosciuto Paolo da anni".'},
4:{r:['Diretos: lo, la, li, le · indiretos: gli (a ele), le (a ela), Le (formal)','Combinados: me lo, te la, ce ne, <b>glielo</b> (a ele/ela/eles)','Antes do verbo conjugado; colado a infinitivo, gerúndio e imperativo','lo/la/li/le + avere: o particípio concorda (l\'ho vista)'],e:['Te lo dico domani.','Gliel\'ho dato ieri.','Le chiavi? Le ho prese.','Voglio vederla.'],t:'O "le" indireto do espanhol vira gli (masc.) ou le (fem.).'},
5:{r:['<b>ci</b> = lá, nisso (a/su + coisa): ci vado, ci penso','<b>ne</b> = disso, dele (quantidade, di + coisa): ne ho due','ci vuole / ci vogliono = leva, é preciso (impessoal)','ci metto = eu demoro · ce la faccio = consigo','me ne vado = vou embora'],e:['Quanti figli hai? Ne ho tre.','Ci vogliono due ore.','Non ce la faccio più.','Che ne pensi?'],t:'"Tenho dois" sem ne ✗ → ne ho due.'},
6:{r:['futuro: -rò, -rai, -rà, -remo, -rete, -ranno','Probabilidade: sarà a casa (deve estar em casa)','condizionale: -rei, -resti, -rebbe…: vorrei, potresti','<b>Futuro no passado = condizionale passato</b>','Depois de quando/appena com valor futuro: futuro'],e:['Quando arriverai, chiamami.','Vorrei un caffè.','Ha detto che sarebbe venuto.','Avrà perso il treno.'],t:'"Disse que viria" → ha detto che SAREBBE VENUTO (não "verrebbe").'},
7:{r:['tu: parla, prendi, senti, finisci · Lei: parli, prenda, senta','Negativo de tu: <b>non + infinitivo</b> (non parlare!)','Pronomes colados com tu/noi/voi: guardalo, sedetevi','Formas curtas dobram: dimmi, fallo, dammelo, vattene','Com Lei, pronome antes: mi dica, si accomodi'],e:['Dimmi la verità!','Non preoccuparti.','Signora, si accomodi.','Il libro? Dammelo!'],t:'"Dime" ✗ → dimmi. "Non parla!" ✗ → non parlare!'},
8:{r:['Formas: -are → -i; -ere/-ire → -a (parli, prenda, senta)','Depois de opinião, vontade, emoção, dúvida: penso che <b>sia</b>','Conjunções: benché, affinché, purché, prima che, a meno che','Mesmo sujeito: di + infinitivo (penso di avere ragione)','Indicativo com: secondo me, so che, sono sicura che, anche se'],e:['Penso che tu abbia ragione.','Spero che stia bene.','Benché piova, esco.','Cerco qualcuno che parli tedesco.'],t:'Em PT/ES "acho que é" usa indicativo; em italiano: credo che SIA.'},
9:{r:['Imperfetto do subjuntivo: -assi, -essi, -issi (= -ra/-se do ES, -sse do PT)','fossi, avessi, facessi, dessi, stessi','Passado no principal → congiuntivo imperfetto','vorrei / mi piacerebbe che + imperfetto','magari + imperfetto · come se + imperfetto'],e:['Pensavo che fossi partita.','Vorrei che tu venissi.','Magari fosse vero!','Parla come se sapesse tutto.'],t:'"Vorrei che tu venga" ✗ → vorrei che tu VENISSI.'},
10:{r:['Real: se + presente → presente/futuro','Possível: se + cong. imperfetto → condizionale','Irreal: se + cong. trapassato → condizionale passato','Misto: se avessi fatto… ora farei…','Formal: qualora + congiuntivo'],e:['Se piove, resto a casa.','Se avessi tempo, viaggerei.','Se l\'avessi saputo, sarei venuta.','Se fossi in te, accetterei.'],t:'Nunca condicional depois de se: "se avrei" ✗.'},
11:{r:['si impersonale: si mangia tardi · reflexivos: ci si alza','si passivante concorda: si vendono case','Passiva: essere (todas) · venire (ação) · <b>andare</b> (obrigação)','Gerúndio: essendo stanca, studiando si impara','Particípio absoluto: finita la cena, siamo usciti'],e:['Il modulo va compilato.','La legge è stata approvata.','Si vendono libri usati.','Arrivata a casa, ha cenato.'],t:'andare + particípio = "deve ser": il vino va servito fresco.'},
12:{r:['Discurso indireto no passado: presente → imperfetto, passato → trapassato','futuro → condizionale passato · imperativo → di + infinito','questo → quello · oggi → quel giorno · domani → il giorno dopo','Conectivos: tuttavia, eppure, anzi, quindi, siccome, insomma','Passato remoto: parlai, parlò · fu, ebbe, fece, disse'],e:['Ha detto che era stanca.','Mi ha chiesto se avessi tempo.','Non è caro, anzi!','Dante nacque nel 1265.'],t:'anzi = pelo contrário (não "antes") · mica = nada (non è mica vero).'},
13:{r:['<b>che</b>: sujeito ou objeto','preposição + <b>cui</b>: con cui, di cui, in cui, per cui','<b>il cui / la cui</b> = cujo (artigo concorda com a coisa)','il quale / la quale: formal, evita ambiguidade','chi = quem · quello che / ciò che = o que · il che = o que (frase)'],e:['Il libro di cui ti ho parlato.','La città in cui vivo.','Una ragazza il cui padre è medico.','Chi cerca trova.'],t:'"Con che" ✗ → con cui.'},
14:{r:['+ a: cominciare, continuare, riuscire, imparare, provare, aiutare','+ di: decidere, finire, smettere, cercare, sperare, ricordarsi','Sem preposição: volere, potere, dovere, sapere, preferire','dipendere da · contare su · innamorarsi di · assomigliare a','acabei de… = sono appena + particípio'],e:['Ho deciso di cambiare lavoro.','Non riesco a dormire.','Sono appena arrivata.','Mi sono innamorata di lui.'],t:'Penso a te (em você) · penso di partire (pretendo partir).'},
15:{r:['fare + infinitivo = mandar fazer: faccio riparare la macchina','Quem executa: a / da (ho fatto leggere la lettera a Marco)','lasciare + infinitivo, sem preposição: lasciami parlare','cavarsela, farcela, prendersela, sentirsela, passarsela, avercela con','Nos tempos compostos: essere + concordância com la (me la sono cavata)'],e:['Mi faccio tagliare i capelli.','Me la cavo con l\'inglese.','Non me la sento.','Perché ce l\'hai con me?'],t:'"Mi taglio i capelli" = corto eu mesma. No cabeleireiro: mi faccio tagliare.'},
16:{r:['Nominalização: decidere → la decisione, aumentare → l\'aumento','fare → effettuare, svolgere · dire → affermare · avere → disporre di','Abertura: Gentile / Egregio / Spettabile','Com la presente… · In riferimento a… · Le sarei grata se…','Fecho: Resto in attesa di un Suo cortese riscontro. Distinti saluti.'],e:['Il progetto comporta costi elevati.','Le scrivo in merito alla Sua richiesta.','La ringrazio anticipatamente.','Distinti saluti.'],t:'comportare = implicar, acarretar (não "comportar-se").'}
};

(function(){
const unit={
id:110, n:'P7', lvl:'A1 → A2', band:0,
title:'C\'è o ci sono? Dire che cosa c\'è (e che cosa non c\'è)',
sub:'Há, tem, existe · c\'è, ci sono, è, ecco',
focus:'c\'è + singolare, ci sono + plurale; forma negativa e interrogativa; c\'è / ci sono o è / sono (esistenza o posizione); c\'è o ho (esistenza o possesso); ecco; usi quotidiani: c\'è il sole, c\'è Marco?, che c\'è?, non c\'è problema, non c\'è campo',
lesson:`
<p class="lead">Em português dizemos <b>tem</b> ou <b>há</b>, e em espanhol <b>hay</b>: uma forma só, para tudo. Em italiano é o verbo <b>essere</b> com a partícula <b>ci</b> («aí, lá»). E como é <i>essere</i>, ele <b>concorda</b>: singular ou plural.</p>
<div class="tw"><table class="tbl">
<tr><th></th><th>singular</th><th>plural</th></tr>
<tr><th>afirmativa</th><td><b>C'è</b> un bar qui vicino.</td><td><b>Ci sono</b> due farmacie.</td></tr>
<tr><th>negativa</th><td><b>Non c'è</b> latte.</td><td><b>Non ci sono</b> autobus la sera.</td></tr>
<tr><th>pergunta</th><td><b>C'è</b> un bagno?</td><td><b>Ci sono</b> posti liberi?</td></tr>
<tr><th>resposta curta</th><td>Sì, c'è. · No, non c'è.</td><td>Sì, ci sono. · No, non ci sono.</td></tr>
</table></div>
<p><b>C'è</b> = <i>ci + è</i>: o <i>i</i> cai e entra o apóstrofo. Por isso nunca se escreve <s>ci è</s> nem <s>ce</s>. No plural não se junta nada: <b>ci sono</b>, separado. A pergunta é igual à afirmação, muda só a entonação (como em português).</p>

<h3>O que vem depois</h3>
<div class="tw"><table class="tbl">
<tr><th>c'è +</th><td>um nome no singular, quase sempre com <b>un, uno, una, un'</b>, ou sem artigo para coisas que não se contam</td><td><i>C'è <b>una</b> farmacia. C'è <b>un</b> problema. C'è <b>tempo</b>. Non c'è <b>pane</b>.</i></td></tr>
<tr><th>ci sono +</th><td>um nome no plural, com número, <b>molti/tanti</b>, <b>alcuni</b>, <b>dei/delle</b> ou sem artigo</td><td><i>Ci sono <b>tre</b> camere. Ci sono <b>molti</b> turisti. Ci sono <b>delle</b> sedie. Non ci sono <b>taxi</b>.</i></td></tr>
</table></div>
<p>Atenção ao verbo, não ao português: <i>tem muita gente</i> → <b>c'è</b> molta gente (<i>gente</i> é singular!) · <i>tem muitos turistas</i> → <b>ci sono</b> molti turisti.</p>
<p>Numa lista, use o plural: <i>In camera <b>ci sono</b> un letto, un armadio e due sedie.</i> (Na fala você vai ouvir também <i>c'è un letto, un armadio…</i>, concordando com a primeira palavra.)</p>

<h3>C'è ou è? Existe ou onde está?</h3>
<p>É o erro mais comum. <b>C'è / ci sono</b> diz que uma coisa <b>existe</b> num lugar (informação nova, em geral com <i>un/una</i>). <b>È / sono</b> diz <b>onde está</b> uma coisa que já conhecemos (com <i>il/la</i>, nomes próprios).</p>
<div class="tw"><table class="tbl">
<tr><th>existe? → c'è / ci sono</th><th>onde está? → è / sono, dov'è / dove sono</th></tr>
<tr><td><i>C'è <b>un</b> museo in questa città?</i><br>Tem um museu nesta cidade?</td><td><i><b>Il</b> museo <b>è</b> in piazza.</i> · <i><b>Dov'è</b> il museo?</i><br>O museu fica na praça. Onde fica o museu?</td></tr>
<tr><td><i>Qui vicino <b>ci sono</b> due banche.</i></td><td><i><b>Le</b> banche <b>sono</b> in via Roma.</i> · <i><b>Dove sono</b> le banche?</i></td></tr>
<tr><td><i>C'è una ragazza alla porta.</i></td><td><i>Giulia <b>è</b> alla porta.</i></td></tr>
</table></div>
<p>Truque: se em português você pode dizer <b>«tem um…»</b> ou <b>«há um…»</b>, é <b>c'è</b>. Se você diz <b>«o/a … fica…»</b> ou <b>«está…»</b>, é <b>è</b>.</p>

<h3>C'è ou ho? Existe ou é meu?</h3>
<p>O nosso <b>«tem»</b> serve para duas coisas. Em italiano são dois verbos:</p>
<div class="tw"><table class="tbl">
<tr><th>existência (há, tem num lugar)</th><th>posse (eu tenho, você tem)</th></tr>
<tr><td><i>In frigo <b>c'è</b> il latte?</i> · Tem leite na geladeira?</td><td><i><b>Hai</b> del latte?</i> · Você tem leite?</td></tr>
<tr><td><i>A Roma <b>ci sono</b> molte chiese.</i></td><td><i>Roma <b>ha</b> molte chiese.</i> (as duas estão certas!)</td></tr>
<tr><td><i>Non <b>c'è</b> tempo!</i> · Não há tempo!</td><td><i>Non <b>ho</b> tempo.</i> · Eu não tenho tempo.</td></tr>
</table></div>

<h3>E «ecco»?</h3>
<p><b>Ecco</b> = <i>eis, olha aqui, aqui está</i>: serve para <b>mostrar</b> algo que você está vendo ou entregando. Não muda: <i><b>Ecco</b> il bar! · <b>Ecco</b> le chiavi. · <b>Ecco</b> a Lei il resto.</i> Compare: <i>C'è un bar?</i> (existe?) → <i>Sì, ecco il bar, lì a destra!</i> (olha ele ali).</p>

<h3>Expressões de todo dia com c'è</h3>
<div class="tw"><table class="tbl">
<tr><td><i>C'è il sole · c'è vento · c'è nebbia</i></td><td>faz sol, está ventando, tem neblina</td></tr>
<tr><td><i>Pronto, <b>c'è</b> Marco? — No, non c'è.</i></td><td>Alô, o Marco está? — Não, não está. (ao telefone, na porta)</td></tr>
<tr><td><i>Che c'è? · Che cosa c'è?</i></td><td>O que foi? O que houve?</td></tr>
<tr><td><i>Non c'è problema · Non c'è di che</i></td><td>Sem problema · Não há de quê</td></tr>
<tr><td><i>C'è tempo · Non c'è tempo</i></td><td>Há tempo · Não dá tempo</td></tr>
<tr><td><i>Non c'è campo</i></td><td>O celular está sem sinal</td></tr>
<tr><td><i>Non c'è nessuno · Non c'è niente</i></td><td>Não tem ninguém · Não tem nada (dupla negação, como em português!)</td></tr>
<tr><td><i>C'è da fare · C'è da aspettare</i></td><td>Tem coisa para fazer · Tem que esperar</td></tr>
</table></div>
<p class="note">Mais adiante você vai encontrar o passado: <i>c'era / c'erano</i> (havia) e <i>c'è stato / ci sono stati</i> (houve). O mecanismo é o mesmo: <i>ci</i> + essere.</p>

<div class="trap"><span class="pen">As armadilhas de quem fala português e espanhol</span>
<ul class="dots">
<li>Tem um bar aqui perto? / ¿Hay un bar? → <b>C'è</b> un bar qui vicino? (nunca <s>ha un bar</s>, <s>tiene un bar</s>)</li>
<li>Tem muitos turistas → <b>Ci sono</b> molti turisti (nunca <s>c'è molti turisti</s>)</li>
<li>Tem muita gente → <b>C'è</b> molta gente (<i>gente</i> é singular)</li>
<li><s>Ci è</s> / <s>ce</s> → <b>c'è</b>, com apóstrofo e acento</li>
<li>Onde fica o Coliseu? → <b>Dov'è</b> il Colosseo? (nunca <s>Dove c'è il Colosseo?</s>)</li>
<li>Tem o museu aqui? → <b>C'è un</b> museo qui? (existência pede <i>un</i>, não <i>il</i>)</li>
<li>Eu tenho dois irmãos → <b>Ho</b> due fratelli (posse → avere)</li>
<li>Faz dois anos que… → isso não é c'è: <i>Studio da due anni</i> · <i>due anni <b>fa</b></i></li>
</ul></div>
<div class="plus"><span class="pen">Per chi parla spagnolo</span> Pense em <b>hay = c'è / ci sono</b>, mas lembre que o italiano concorda: <i>hay un libro → c'è un libro</i>, <i>hay dos libros → ci sono due libri</i>. E <i>¿dónde está el baño?</i> continua sendo <b>dov'è</b> il bagno?</div>
`,

title:'La mia nuova casa a Bologna',
text:`<p>Cara Ana, finalmente ho una casa! È un appartamento piccolo al terzo piano, in una via vicino al centro di Bologna. Non c'è l'ascensore, ma ci sono tante finestre e la luce è bellissima.</p>
<p>Nell'appartamento ci sono due stanze, una cucina e un bagno. In camera ci sono un letto, un armadio e una scrivania per lavorare. In cucina c'è tutto: c'è il frigo, c'è il forno e c'è anche una macchina per il caffè. Non c'è la lavatrice, però: il sabato vado alla [[lavanderia|lavanderia]] qui sotto.</p>
<p>Il quartiere è vivace. Sotto casa c'è un forno e all'angolo c'è un bar con un cornetto buonissimo. Non ci sono supermercati grandi, ma ci sono tre piccoli negozi di alimentari e un mercato il martedì. Il parco è a cinque minuti a piedi.</p>
<p>E poi ci sono i [[portici|pórticos, galerias cobertas]]! A Bologna ci sono quasi quaranta chilometri di portici: quando piove, non c'è bisogno dell'ombrello.</p>
<p>Quando vieni? C'è sempre un posto per te sul divano! Un abbraccio, Luísa</p>`,

'101.lesson':`
<p class="lead">El italiano se lee casi exactamente como se escribe. Con una docena de reglas puedes leer en voz alta cualquier palabra, y ahí empieza la melodía de la lengua.</p>
<h3>Los sonidos que cambian</h3>
<div class="tw"><table class="tbl">
<tr><th>se escribe</th><th>suena</th><th>como en…</th><th>ejemplos</th></tr>
<tr><td><b>ce, ci</b></td><td>"ch"</td><td>chico</td><td><i>cena, ciao, cinema, dolce</i></td></tr>
<tr><td><b>che, chi</b></td><td>"k"</td><td>queso</td><td><i>che, chiave, Michele, pochi</i></td></tr>
<tr><td><b>ca, co, cu</b></td><td>"k"</td><td>casa</td><td><i>casa, come, cuore</i></td></tr>
<tr><td><b>ge, gi</b></td><td>"y" fuerte, como la <i>j</i> inglesa de <i>John</i></td><td>"yo" dicho con fuerza</td><td><i>gelato, giorno, Giulia</i></td></tr>
<tr><td><b>ghe, ghi</b></td><td>"g" suave</td><td>guerra</td><td><i>spaghetti, laghi</i></td></tr>
<tr><td><b>gli</b></td><td>"ll" (la de antes: <i>calle</i> bien marcada) · PT "lh"</td><td>pollo</td><td><i>figlio, famiglia, moglie</i></td></tr>
<tr><td><b>gn</b></td><td>"ñ"</td><td>niño</td><td><i>gnocchi, lasagna, bagno</i></td></tr>
<tr><td><b>sce, sci</b></td><td>"sh" (como el inglés <i>she</i>)</td><td>PT "chá"</td><td><i>pesce, sciare, uscita</i></td></tr>
<tr><td><b>sche, schi</b></td><td>"sk"</td><td>—</td><td><i>scherzo, schiena</i></td></tr>
<tr><td><b>z, zz</b></td><td>"ts" o "ds", nunca la <i>z</i> española</td><td>—</td><td><i>pizza</i> (ts), <i>zero</i> (ds)</td></tr>
<tr><td><b>h</b></td><td>muda</td><td>hora</td><td><i>ho, hai, ha, hanno</i></td></tr>
</table></div>
<p>En <i>ciao, giorno, giallo</i> la <b>i</b> solo sirve para dar el sonido "ch"/"y": no se pronuncia. Se dice "chao", "yorno".</p>
<div class="trap"><span class="pen">¡Atención!</span> Las vocales finales siempre suenan claras: <i>latte</i> es "lát-te", nunca "látchi" (cuidado si vienes del portugués de Brasil); <i>sette</i> es "sét-te". Y <b>di</b>, <b>ti</b> nunca suenan "yi", "chi": <i>dico</i> = "dí-ko", <i>tipo</i> = "tí-po". La <b>s</b> entre vocales suele sonar sonora, como un zumbido: <i>casa</i> ≈ "kasa" con <i>s</i> vibrante.</div>
<h3>Consonantes dobles</h3>
<p>Las <i>doppie</i> se pronuncian más largas, con una pequeña pausa, y cambian el significado: <i>nono</i> (noveno) ≠ <i>nonno</i> (abuelo) · <i>sete</i> (sed) ≠ <i>sette</i> (siete) · <i>caro</i> ≠ <i>carro</i> · <i>pena</i> ≠ <i>penna</i> (bolígrafo). Es el punto más difícil para los hispanohablantes: exagera al principio.</p>
<h3>El acento</h3>
<p>La mayoría de las palabras son llanas: <i>a-MI-co, par-LA-re</i>. La tilde solo se escribe en la última sílaba: <i>città, perché, caffè, così</i>. Y <b>è</b> (es, verbo) ≠ <b>e</b> (y, conjunción).</p>
<h3>Saludos</h3>
<div class="tw"><table class="tbl">
<tr><th>informal (tu)</th><th>formal (Lei)</th></tr>
<tr><td><i>Ciao!</i> (hola / adiós)</td><td><i>Buongiorno</i> (hasta primera hora de la tarde) · <i>Buonasera</i></td></tr>
<tr><td><i>Come stai?</i></td><td><i>Come sta?</i></td></tr>
<tr><td><i>Come ti chiami?</i></td><td><i>Come si chiama?</i></td></tr>
<tr><td><i>A presto! Ci vediamo!</i></td><td><i>Arrivederci! ArrivederLa!</i></td></tr>
</table></div>
<p><i>Buonanotte</i> solo para irse a dormir. Para presentarte: <i>Mi chiamo Ana. Sono brasiliana, di Recife. Piacere!</i> Respuesta: <i>Piacere mio!</i></p>
<div class="plus"><span class="pen">Ventaja</span> El <b>Lei</b> formal usa el verbo en 3.ª persona, exactamente como «usted»: <i>Lei come sta?</i> = ¿Cómo está usted?</div>
<div class="trap"><span class="pen">Palabras útiles</span> <i>grazie</i> (gracias) · <i>prego</i> (de nada / adelante, pase) · <i>per favore</i> (por favor) · <i>scusa / scusi</i> (perdona / perdone) · <i>sì / no</i> · <i>va bene</i> (vale, de acuerdo).</div>

'102.lesson':`
<p class="lead">Los dos verbos más importantes. En italiano, <b>essere</b> hace de «ser» y casi siempre también de «estar», y <b>avere</b> es «tener» (y el auxiliar «haber»).</p>
<div class="tw"><table class="tbl">
<tr><th></th><th>essere</th><th>avere</th></tr>
<tr><th>io</th><td>sono</td><td>ho</td></tr>
<tr><th>tu</th><td>sei</td><td>hai</td></tr>
<tr><th>lui / lei / Lei</th><td>è</td><td>ha</td></tr>
<tr><th>noi</th><td>siamo</td><td>abbiamo</td></tr>
<tr><th>voi</th><td>siete</td><td>avete</td></tr>
<tr><th>loro</th><td>sono</td><td>hanno</td></tr>
</table></div>
<p>La <b>h</b> es muda y solo sirve para distinguir: <i>ho</i> (tengo) / <i>o</i> (o) · <i>ha</i> (tiene) / <i>a</i> (a, preposición) · <i>hanno</i> (tienen) / <i>anno</i> (año). Como en español, el pronombre sujeto suele omitirse: <i>Sono stanca</i> = Estoy cansada.</p>
<h3>Adjetivos: concordancia</h3>
<div class="tw"><table class="tbl">
<tr><th></th><th>masc. sing.</th><th>fem. sing.</th><th>masc. pl.</th><th>fem. pl.</th></tr>
<tr><td>en -o</td><td>alto</td><td>alta</td><td>alti</td><td>alte</td></tr>
<tr><td>en -e</td><td>gentile</td><td>gentile</td><td>gentili</td><td>gentili</td></tr>
</table></div>
<p><b>Nacionalidades:</b> brasiliano/a, italiano/a, spagnolo/a, argentino/a, americano/a, tedesco/a (alemán) · y en -e: portoghese, francese, inglese, cinese, giapponese.</p>
<p><b>Profesiones:</b> <i>Che lavoro fai?</i> → <i>Sono insegnante / medico / ingegnere / studentessa / programmatrice</i> (sin artículo), o <i>Faccio la programmatrice</i> (con artículo).</p>
<h3>Expresiones con avere</h3>
<div class="chips">ho fame (tengo hambre) · ho sete (sed) · ho freddo (frío) · ho caldo (calor) · ho sonno (sueño) · ho fretta (prisa) · ho paura (miedo) · ho ragione (tengo razón) · ho bisogno di… (necesito…)</div>
<div class="trap"><span class="pen">¡Atención!</span> La edad va con <b>avere</b>: <i>Ho trent'anni</i> (nunca «sono trent'anni»). Y si vienes del portugués: «estar com fome» es <i>avere fame</i>, nada de «sono con fame».</div>
<div class="plus"><span class="pen">Para hispanohablantes</span> Aquí el español ayuda: <i>tengo hambre → ho fame</i>, <i>tengo frío → ho freddo</i>. El «estar» (<i>stare</i>) aparece en pocas expresiones: <i>Come stai? Sto bene. Sto a casa.</i> Para todo lo demás, <i>essere</i>: <i>Sono stanca, sono a Madrid</i>.</div>
`,
'103.lesson':`
<p class="lead">Casi todos los sustantivos italianos terminan en vocal, y esa vocal indica el género y el número. El plural no lleva <b>-s</b>: cambia la vocal final.</p>
<div class="tw"><table class="tbl">
<tr><th>singular</th><th>plural</th><th>ejemplo</th></tr>
<tr><td>-o (masc.)</td><td>-i</td><td><i>il libro → i libri</i></td></tr>
<tr><td>-a (fem.)</td><td>-e</td><td><i>la casa → le case</i></td></tr>
<tr><td>-e (masc. o fem.)</td><td>-i</td><td><i>il fiore → i fiori · la chiave → le chiavi</i></td></tr>
<tr><td>tilde final o consonante</td><td>no cambia</td><td><i>la città → le città · il caffè → i caffè · il bar → i bar</i></td></tr>
</table></div>
<p><b>Ortografía:</b> -ca/-ga → -che/-ghe (<i>l'amica → le amiche</i>); -co/-go → -chi/-ghi (<i>il gioco → i giochi</i>), con excepciones como <i>l'amico → gli amici</i>.</p>
<p><b>Irregulares frecuentes:</b> <i>l'uomo → gli uomini · la mano → le mani · l'uovo → le uova</i>.</p>
<h3>Artículos (versión sencilla)</h3>
<div class="tw"><table class="tbl">
<tr><th></th><th>determinado sing.</th><th>determinado pl.</th><th>indeterminado</th></tr>
<tr><td>masc. (la mayoría)</td><td>il libro</td><td>i libri</td><td>un libro</td></tr>
<tr><td>masc. + s+consonante, z</td><td>lo studente, lo zaino</td><td>gli studenti</td><td>uno studente</td></tr>
<tr><td>masc. + vocal</td><td>l'amico</td><td>gli amici</td><td>un amico</td></tr>
<tr><td>fem.</td><td>la casa · l'amica</td><td>le case · le amiche</td><td>una casa · un'amica</td></tr>
</table></div>
<p>En la unidad 1 verás los artículos en detalle, junto con las preposiciones.</p>
<div class="trap"><span class="pen">¡Género distinto!</span> <i>il fiore</i> (la flor) · <i>il ponte</i> (el puente: PT <i>a ponte</i>) · <i>il colore</i> (el color) · <i>il dolore</i> (el dolor) · <i>il latte</i> (la leche) · <i>il sale</i> (la sal) · <i>il miele</i> (la miel) · <i>la fine</i> (el fin). Como en español, <i>il problema, il programma, il cinema</i> son masculinos.</div>
`,

'110.lesson':`
<p class="lead">En español decimos <b>hay</b>: una sola forma para todo. En italiano se usa el verbo <b>essere</b> con la partícula <b>ci</b> («ahí, allí»). Y como es <i>essere</i>, <b>concuerda</b>: singular o plural.</p>
<div class="tw"><table class="tbl">
<tr><th></th><th>singular</th><th>plural</th></tr>
<tr><th>afirmativa</th><td><b>C'è</b> un bar qui vicino.</td><td><b>Ci sono</b> due farmacie.</td></tr>
<tr><th>negativa</th><td><b>Non c'è</b> latte.</td><td><b>Non ci sono</b> autobus la sera.</td></tr>
<tr><th>pregunta</th><td><b>C'è</b> un bagno?</td><td><b>Ci sono</b> posti liberi?</td></tr>
<tr><th>respuesta corta</th><td>Sì, c'è. · No, non c'è.</td><td>Sì, ci sono. · No, non ci sono.</td></tr>
</table></div>
<p><b>C'è</b> = <i>ci + è</i>: la <i>i</i> cae y entra el apóstrofo. Por eso nunca se escribe <s>ci è</s> ni <s>ce</s>. En plural no se une nada: <b>ci sono</b>, separado. La pregunta es igual que la afirmación; solo cambia la entonación.</p>

<h3>Qué va detrás</h3>
<div class="tw"><table class="tbl">
<tr><th>c'è +</th><td>un sustantivo en singular, casi siempre con <b>un, uno, una, un'</b>, o sin artículo para cosas que no se cuentan</td><td><i>C'è <b>una</b> farmacia. C'è <b>un</b> problema. C'è <b>tempo</b>. Non c'è <b>pane</b>.</i></td></tr>
<tr><th>ci sono +</th><td>un sustantivo en plural, con número, <b>molti/tanti</b>, <b>alcuni</b>, <b>dei/delle</b> o sin artículo</td><td><i>Ci sono <b>tre</b> camere. Ci sono <b>molti</b> turisti. Ci sono <b>delle</b> sedie. Non ci sono <b>taxi</b>.</i></td></tr>
</table></div>
<p>Fíjate en el sustantivo, no en el «hay»: <i>hay mucha gente</i> → <b>c'è</b> molta gente (<i>gente</i> es singular) · <i>hay muchos turistas</i> → <b>ci sono</b> molti turisti.</p>
<p>En una lista, usa el plural: <i>In camera <b>ci sono</b> un letto, un armadio e due sedie.</i> (Hablando también oirás <i>c'è un letto, un armadio…</i>, concordando con la primera palabra.)</p>

<h3>¿C'è o è? ¿Existe o dónde está?</h3>
<p>Es el error más frecuente. <b>C'è / ci sono</b> dice que algo <b>existe</b> en un lugar (información nueva, normalmente con <i>un/una</i>): es el «hay». <b>È / sono</b> dice <b>dónde está</b> algo que ya conocemos (con <i>il/la</i>, nombres propios): es el «está».</p>
<div class="tw"><table class="tbl">
<tr><th>¿existe? → c'è / ci sono</th><th>¿dónde está? → è / sono, dov'è / dove sono</th></tr>
<tr><td><i>C'è <b>un</b> museo in questa città?</i><br>¿Hay un museo en esta ciudad?</td><td><i><b>Il</b> museo <b>è</b> in piazza.</i> · <i><b>Dov'è</b> il museo?</i><br>El museo está en la plaza. ¿Dónde está el museo?</td></tr>
<tr><td><i>Qui vicino <b>ci sono</b> due banche.</i></td><td><i><b>Le</b> banche <b>sono</b> in via Roma.</i> · <i><b>Dove sono</b> le banche?</i></td></tr>
<tr><td><i>C'è una ragazza alla porta.</i></td><td><i>Giulia <b>è</b> alla porta.</i></td></tr>
</table></div>
<p>Truco: si en español dices <b>«hay…»</b>, es <b>c'è / ci sono</b>. Si dices <b>«está / están…»</b>, es <b>è / sono</b>. Igual que en español: «hay un museo» pero «el museo está».</p>

<h3>¿C'è o ho? ¿Hay o tengo?</h3>
<p>En portugués «tem» sirve para las dos cosas; en español y en italiano son dos verbos:</p>
<div class="tw"><table class="tbl">
<tr><th>existencia (hay)</th><th>posesión (tengo, tienes)</th></tr>
<tr><td><i>In frigo <b>c'è</b> il latte?</i> · ¿Hay leche en la nevera?</td><td><i><b>Hai</b> del latte?</i> · ¿Tienes leche?</td></tr>
<tr><td><i>A Roma <b>ci sono</b> molte chiese.</i></td><td><i>Roma <b>ha</b> molte chiese.</i> (¡las dos son correctas!)</td></tr>
<tr><td><i>Non <b>c'è</b> tempo!</i> · ¡No hay tiempo!</td><td><i>Non <b>ho</b> tempo.</i> · No tengo tiempo.</td></tr>
</table></div>

<h3>¿Y «ecco»?</h3>

'1.lesson':`
<p class="lead">En italiano el artículo depende del <em>sonido inicial</em> de la palabra siguiente, y las preposiciones se funden con él mucho más que en español (que solo tiene «al» y «del»). Parece un detalle, pero aparece en todas las frases: merece la pena automatizarlo pronto.</p>
<h3>Artículos determinados</h3>
<div class="tw"><table class="tbl">
<tr><th></th><th>delante de consonante</th><th>s + consonante, z, gn, ps, x, y</th><th>delante de vocal</th></tr>

<tr><th>fem. sing.</th><td>la casa</td><td>la studentessa</td><td>l'amica</td></tr>
<tr><th>fem. pl.</th><td>le case</td><td>le studentesse</td><td>le amiche</td></tr>
</table></div>
<p>Los indeterminados siguen la misma lógica: <i>un libro, uno zaino, un amico</i> (¡sin apóstrofo en masculino!), <i>una casa, un'amica</i>.</p>
<h3>Preposiciones articuladas</h3>
<div class="tw"><table class="tbl c">
<tr><th></th><th>il</th><th>lo</th><th>l'</th><th>la</th><th>i</th><th>gli</th><th>le</th></tr>
<tr><th>di</th><td>del</td><td>dello</td><td>dell'</td><td>della</td><td>dei</td><td>degli</td><td>delle</td></tr>
<tr><th>a</th><td>al</td><td>allo</td><td>all'</td><td>alla</td><td>ai</td><td>agli</td><td>alle</td></tr>
<tr><th>da</th><td>dal</td><td>dallo</td><td>dall'</td><td>dalla</td><td>dai</td><td>dagli</td><td>dalle</td></tr>
<tr><th>in</th><td>nel</td><td>nello</td><td>nell'</td><td>nella</td><td>nei</td><td>negli</td><td>nelle</td></tr>
<tr><th>su</th><td>sul</td><td>sullo</td><td>sull'</td><td>sulla</td><td>sui</td><td>sugli</td><td>sulle</td></tr>
</table></div>
<p><i>Con</i> y <i>per</i> normalmente no se funden: <i>con il treno, per la strada</i>.</p>
<h3>Partitivo: «un poco de», «unos»</h3>
<p><i>di</i> + artículo indica una cantidad indeterminada: <i>Vorrei <b>del</b> pane</i> (quiero pan), <i>Ho conosciuto <b>degli</b> studenti brasiliani</i> (unos estudiantes). En las negativas desaparece: <i>Non ho pane</i>.</p>
<h3>Los posesivos llevan artículo</h3>
<p>A diferencia del español: <i>il mio libro</i> (mi libro), <i>la tua casa, i nostri amici</i>. Excepción: familiares en singular, sin adjetivo ni diminutivo → <i>mia madre, tuo fratello</i>. Pero: <i>i miei fratelli, la mia sorellina, la loro madre</i> (<i>loro</i> siempre con artículo).</p>
<div class="trap"><span class="pen">¡Atención!</span> Ir a casa o a la consulta de alguien se dice con <b>da</b>: <i>vado dal medico, vado da Marco</i> (en español <i>al médico</i>). Los lugares «institucionales» van con <b>in</b> sin artículo: <i>in banca, in ufficio, in biblioteca, in centro, in montagna</i>. Ciudades con <b>a</b> (<i>a Roma</i>), países con <b>in</b> (<i>in Italia</i>), países en plural con artículo (<i>negli Stati Uniti</i>).</div>
<div class="trap"><span class="pen">Para hispanohablantes</span> <b>lo</b> no es neutro: es artículo masculino (<i>lo zio</i> = el tío). Y <b>gli</b> es el plural masculino (<i>gli amici</i>), nada que ver con el «le» de complemento indirecto.</div>

'2.lesson':`
<p class="lead">El español usa un solo auxiliar (<i>haber</i>). El italiano usa dos, <b>avere</b> y <b>essere</b>, y elegir el equivocado suena enseguida a extranjero. La buena noticia: la regla es bastante previsible.</p>
<h3>Quién usa <b>essere</b></h3>
<ul class="dots">
<li>Verbos de movimiento con destino u origen: <i>andare, venire, arrivare, partire, uscire, entrare, tornare, cadere</i>.</li>
<li>Cambio de estado: <i>nascere, morire, diventare, crescere, invecchiare, aumentare, dimagrire</i>.</li>
<li>Estado/permanencia: <i>essere, stare, restare, rimanere</i>.</li>
<li>Todos los reflexivos: <i>mi sono svegliata</i> (me he despertado), <i>ci siamo divertiti</i>.</li>
<li><i>piacere, sembrare, succedere, costare, bastare, mancare, durare, servire</i>.</li>
</ul>
<p>Los transitivos (con complemento directo) usan <b>avere</b>: <i>ho mangiato, ho visto, ho scritto</i>. También algunos intransitivos de actividad: <i>ho dormito, ho camminato, ho lavorato, ho viaggiato</i>.</p>
<h3>Concordancia del participio</h3>
<p>Con <b>essere</b>, el participio concuerda con el sujeto: <i>Maria è andat<b>a</b>, le ragazze sono uscit<b>e</b>, i prezzi sono aumentat<b>i</b></i>. Con <b>avere</b>, es invariable: <i>Maria ha mangiat<b>o</b></i> (en la unidad 4 verás la excepción con pronombres).</p>
<h3>Verbos con los dos auxiliares</h3>
<p>Cambian según tengan complemento directo: <i>Ho finito il lavoro</i> / <i>Il film è finito</i>; <i>Ho salito le scale</i> / <i>Sono salita sul treno</i>; <i>Ho cambiato casa</i> / <i>Sei cambiata tanto!</i> Igual con <i>cominciare, passare, correre, scendere</i>.</p>
<h3>Participios irregulares más frecuentes</h3>
<div class="chips">fatto · detto · scritto · letto · preso · messo · visto · aperto · chiuso · chiesto · risposto · rimasto · scelto · spento · acceso · vinto · perso · corso · nato · morto · vissuto · successo · rotto · deciso · sceso · offerto · speso · tradotto · promesso · discusso</div>
<div class="trap"><span class="pen">¡Atención!</span> <i>Mi è piaciuto il film / Mi sono piaciuti i film</i>: el participio concuerda con lo que gusta, que es el sujeto gramatical (como «me ha gustado / me han gustado»).</div>
<div class="plus"><span class="pen">Ventaja</span> Uso: el <i>passato prossimo</i> se parece mucho al pretérito perfecto de España (<i>he comido</i>), pero en italiano también cubre el indefinido: <i>ieri ho fatto</i> = ayer hice. El <i>passato remoto</i> queda para textos escritos y para el sur (unidad 12).</div>

'3.lesson':`
<p class="lead">Aquí juegas en casa: la lógica imperfecto/pretérito es la misma del español. La única diferencia es que el «pretérito» italiano es compuesto (<i>ho fatto</i> = hice / he hecho).</p>
<div class="tw"><table class="tbl">
<tr><th>Imperfetto</th><th>Passato prossimo</th></tr>
<tr><td>escenario, descripción: <i>Era tardi e pioveva</i></td><td>acción terminada: <i>È arrivato alle dieci</i></td></tr>
<tr><td>costumbre: <i>Da piccola andavo al mare</i></td><td>vez única o contada: <i>Ci sono andata tre volte</i></td></tr>
<tr><td>acción en curso interrumpida: <i>Mentre cucinavo…</i></td><td>…la interrupción: <i>…è suonato il telefono</i></td></tr>
<tr><td>duración sin límite</td><td>duración delimitada: <i>Ha piovuto tutto il giorno</i></td></tr>
</table></div>
<h3>Formas</h3>
<p>-<b>avo</b>/-<b>evo</b>/-<b>ivo</b>, -vi, -va, -vamo, -vate, -vano (como <i>-aba, -ía</i>). Irregulares: <i>essere → ero, eri, era, eravamo, eravate, erano</i>; <i>fare → facevo</i>; <i>dire → dicevo</i>; <i>bere → bevevo</i>; <i>tradurre → traducevo</i>.</p>
<p><b>Stare + gerundio</b> en imperfetto para la acción en curso: <i>Stavo uscendo quando mi hai chiamato</i> (estaba saliendo cuando me llamaste).</p>
<h3>Trapassato prossimo: el pasado del pasado</h3>
<p>Imperfetto de <i>avere/essere</i> + participio: <i>Quando siamo arrivati, il treno <b>era già partito</b></i>. Corresponde al <i>había salido</i> español, con la misma elección de auxiliar de la unidad 2.</p>
<h3>Verbos que cambian de sentido</h3>
<div class="tw"><table class="tbl">
<tr><th></th><th>imperfetto</th><th>passato prossimo</th></tr>
<tr><th>sapere</th><td><i>Sapevo</i> = ya lo sabía</td><td><i>Ho saputo</i> = me enteré</td></tr>
<tr><th>conoscere</th><td><i>Conoscevo Anna</i> = ya la conocía</td><td><i>Ho conosciuto Anna</i> = la conocí (me la presentaron)</td></tr>
<tr><th>dovere</th><td><i>Dovevo partire</i> = tenía que irme (quizá no me fui)</td><td><i>Sono dovuta partire</i> = tuve que irme (y me fui)</td></tr>
<tr><th>potere</th><td><i>Potevo aiutarti</i> = podía ayudarte</td><td><i>Ho potuto aiutarti</i> = pude ayudarte (lo conseguí)</td></tr>
</table></div>
<div class="trap"><span class="pen">¡Atención!</span> La duración hasta el presente va con <b>presente + da</b>: <i>Conosco Paolo da dieci anni</i> (conozco a Paolo desde hace diez años), <i>Studio italiano da tre mesi</i>. No uses el passato prossimo aquí.</div>
`,
'4.lesson':`
<div class="tw"><table class="tbl">
<tr><th></th><th>directo</th><th>indirecto</th><th>combinado con lo / la / li / le / ne</th></tr>
<tr><th>io</th><td>mi</td><td>mi</td><td><b>me</b> lo, me la, me ne</td></tr>
<tr><th>tu</th><td>ti</td><td>ti</td><td><b>te</b> lo, te la, te ne</td></tr>
<tr><th>lui</th><td>lo</td><td>gli</td><td><b>glielo</b>, gliela, glieli, gliele, gliene</td></tr>
<tr><th>lei / Lei</th><td>la / La</td><td>le / Le</td><td><b>glielo</b>, gliela… (¡iguales!)</td></tr>
<tr><th>noi</th><td>ci</td><td>ci</td><td><b>ce</b> lo, ce la, ce ne</td></tr>
<tr><th>voi</th><td>vi</td><td>vi</td><td><b>ve</b> lo, ve la, ve ne</td></tr>
<tr><th>loro</th><td>li / le</td><td>gli (loro, formal, detrás del verbo)</td><td><b>glielo</b>…</td></tr>
</table></div>
<p>El indirecto va <b>primero</b> y la <i>i</i> se convierte en <i>e</i>: <i>mi + lo → me lo</i>. Con <i>gli/le</i> todo se convierte en una sola palabra: <i>Il libro? <b>Gliel'</b>ho dato</i> (se lo he dado: a él, a ella o a ellos).</p>
<h3>Posición</h3>
<ul class="dots">
<li>Delante del verbo conjugado: <i>Lo vedo domani. Te lo dico.</i></li>
<li>Pegado al infinitivo, gerundio e imperativo (tu/noi/voi), como en español: <i>Voglio veder<b>lo</b>, vedendo<b>lo</b>, guarda<b>lo</b>!</i></li>
<li>Con verbos modales, las dos posiciones: <i>Lo voglio vedere = Voglio vederlo</i> (lo quiero ver = quiero verlo).</li>
</ul>
<h3>Concordancia con el participio</h3>
<p>Con <i>lo, la, li, le</i> delante de <i>avere</i>, el participio concuerda: <i>La torta? L'ho mangiat<b>a</b>. Le chiavi? Le ho pres<b>e</b>.</i> Con <i>ne</i> también: <i>Di mele, ne ho mangiat<b>e</b> tre.</i></p>
<div class="trap"><span class="pen">Para hispanohablantes</span> El <i>le</i> indirecto español corresponde a <b>gli</b> (masc.) o <b>le</b> (fem.). Y el <i>se lo</i> español se convierte en <b>glielo</b>: <i>se lo di → gliel'ho dato</i>. Ojo también con el leísmo: «le vi» (a él) en italiano es <b>l'ho visto</b>, nunca «gli».</div>
<div class="trap"><span class="pen">Si piensas en portugués</span> Con verbo conjugado el pronombre va siempre delante (<i>Ti amo</i>, nunca «amo-ti»), y <i>lhe</i> → <i>gli/le</i>.</div>
`,

'5.lesson':`
<p class="lead">Quien sabe francés reconoce <i>y</i> y <i>en</i>. Para nosotros, <b>ci</b> y <b>ne</b> son la gran novedad del italiano intermedio, y omitirlos es lo que más delata al hablante de español o portugués.</p>
<h3>CI</h3>
<ul class="dots">
<li><b>Lugar</b> (= allí, ahí): <i>Vai a Roma? Sì, <b>ci</b> vado domani.</i> (sí, voy mañana) <i>Ci sono stata due volte.</i></li>
<li><b>a / su + cosa</b>: <i>Pensi al viaggio? Sì, <b>ci</b> penso sempre.</i> (pienso en ello) <i>Non <b>ci</b> credo! Ci conto.</i></li>
<li><b>Esserci</b>: <i>c'è, ci sono</i> (hay).</li>
</ul>
<h3>NE</h3>
<ul class="dots">
<li><b>Partitivo</b> (cantidad): <i>Quanti figli hai? <b>Ne</b> ho due.</i> (tengo dos) <i>Vuoi del vino? No, grazie, non <b>ne</b> voglio.</i></li>
<li><b>di + cosa</b>: <i>Che <b>ne</b> pensi?</i> (¿qué opinas de eso?) <i><b>Ne</b> parliamo dopo.</i> (lo hablamos luego)</li>
<li><b>da + lugar</b>: <i>Sono entrata in banca e <b>ne</b> sono uscita dopo un'ora.</i></li>
</ul>
<h3>Verbos con ci / ne que oirás siempre</h3>
<div class="tw"><table class="tbl">
<tr><td><b>volerci</b></td><td>hacer falta, tardarse (impersonal)</td><td><i>Ci vuole un'ora. Ci vogliono due ore.</i></td></tr>
<tr><td><b>metterci</b></td><td>tardar (alguien)</td><td><i>Ci metto venti minuti a piedi.</i></td></tr>
<tr><td><b>farcela</b></td><td>conseguirlo, poder con algo</td><td><i>Ce la faccio! Non ce la faccio più.</i> (¡no puedo más!)</td></tr>
<tr><td><b>andarsene</b></td><td>irse, marcharse</td><td><i>Me ne vado. Se n'è andata.</i></td></tr>
<tr><td><b>entrarci</b></td><td>tener que ver</td><td><i>Questo non c'entra niente.</i></td></tr>
<tr><td><b>starci</b></td><td>apuntarse, aceptar</td><td><i>Una pizza stasera? Ci sto!</i> (¡me apunto!)</td></tr>
<tr><td><b>fregarsene</b></td><td>importar un pimiento (coloquial)</td><td><i>Me ne frego.</i></td></tr>
</table></div>
<div class="trap"><span class="pen">¡Atención!</span> «Tengo dos» no existe sin <b>ne</b>: <i>Ho due</i> ✗ → <i><b>Ne</b> ho due</i> ✓. Y para el tiempo: <i>ci vuole</i> (impersonal: se tarda) ≠ <i>ci metto</i> (yo tardo).</div>
<div class="plus"><span class="pen">Combinaciones</span> <i>ci + ne → ce n'è, ce ne sono</i>; <i>mi + ne → me ne</i>; <i>ci + la → ce la</i>.</div>
`,
'6.lesson':`
<h3>Futuro</h3>
<p>-<b>rò</b>, -rai, -rà, -remo, -rete, -ranno. En -are la <i>a</i> se convierte en <i>e</i>: <i>parlerò</i>. Irregulares: <i>andrò, avrò, dovrò, potrò, saprò, vedrò, vivrò</i> · <i>berrò, rimarrò, terrò, verrò, vorrò</i> · <i>sarò, farò, darò, starò</i>.</p>
<ul class="dots">
<li><b>Probabilidad</b> en el presente, igual que en español: <i>Saranno le otto</i> = serán las ocho. <i>Avrà fame</i> = tendrá hambre.</li>
<li><b>Futuro anteriore</b> (avrò/sarò + participio): acción futura anterior a otra, y probabilidad en el pasado: <i>Avrà perso il treno</i> = habrá perdido el tren.</li>
</ul>
<div class="trap"><span class="pen">¡Atención!</span> Después de <i>quando, appena, se</i> con valor de futuro, el italiano usa el <b>futuro</b>: <i>Quando <b>arriverai</b>, chiamami</i> (cuando llegues, llámame). El español usa subjuntivo (<i>cuando llegues</i>) y el portugués el futuro de subjuntivo (<i>quando chegares</i>): ninguno de los dos funciona en italiano.</div>
<h3>Condizionale</h3>
<p>-<b>rei</b>, -resti, -rebbe, -remmo, -reste, -rebbero (misma raíz que el futuro): <i>vorrei, potresti, sarebbe</i>.</p>
<ul class="dots">
<li>Cortesía: <i>Vorrei un caffè. Potrebbe aiutarmi?</i></li>
<li>Consejo: <i>Dovresti dormire di più.</i> (deberías dormir más)</li>
<li>Noticia no confirmada (periodístico): <i>Il ministro <b>si sarebbe dimesso</b></i> = el ministro habría dimitido.</li>
</ul>
<h3>El futuro en el pasado</h3>
<div class="tw"><table class="tbl">
<tr><th>Español</th><th>Portugués</th><th>Italiano</th></tr>
<tr><td>Dijo que vendría</td><td>Disse que viria</td><td>Ha detto che <b>sarebbe venuto</b></td></tr>
<tr><td>Pensaba que lo harías</td><td>Pensava que você faria</td><td>Pensavo che l'<b>avresti fatto</b></td></tr>
</table></div>
<p>En italiano, el futuro visto desde el pasado es <b>siempre condicional compuesto</b>, aunque la acción todavía vaya a ocurrir. «Ha detto che verrebbe» es el error más típico de hispanohablantes y lusohablantes en este nivel.</p>
`,
});

ES_SCHEDE={
101:{r:['<b>ce, ci</b> = "ch" · <b>che, chi</b> = "k" · <b>ge, gi</b> = "y" fuerte · <b>ghe, ghi</b> = "g"','<b>gli</b> ≈ "ll" · <b>gn</b> = "ñ" · <b>sce, sci</b> = "sh"','Las consonantes <b>dobles</b> cambian el sentido: nono ≠ nonno','La <b>z</b> suena "ts" o "ds", nunca como la z española','<b>tu</b> con amigos · <b>Lei</b> (verbo en 3.ª persona, como «usted») con desconocidos'],e:['Ciao! Mi chiamo Ana.','Buongiorno, come sta?','Di dove sei? Sono brasiliana.','Piacere! — Piacere mio.'],t:'Buongiorno vale hasta primera hora de la tarde; después, Buonasera. Buonanotte solo para irse a dormir.'},
102:{r:['<b>essere</b>: sono, sei, è, siamo, siete, sono','<b>avere</b>: ho, hai, ha, abbiamo, avete, hanno (h muda)','Adjetivos en -o/-a/-i/-e; en -e solo -e/-i (gentile, gentili)','Edad y sensaciones con <b>avere</b>: ho 30 anni, ho fame, ho freddo','Profesión: sono insegnante · faccio l\'insegnante'],e:['Ho trentadue anni.','Mia sorella è alta e simpatica.','Hai fame? — No, ho sete.','Loro sono francesi.'],t:'Nunca «sono 30 anni». Y «estar cansada» = sono stanca (essere, no stare).'},
103:{r:['-o → -i (libro, libri) · -a → -e (casa, case) · -e → -i (fiore, fiori)','Tilde final y consonante no cambian: le città, i caffè, i bar','<b>il</b> / <b>lo</b> (s+consonante, z) / <b>l\'</b> (vocal) / <b>la</b>','Plurales: i, gli, le · indeterminados: un, uno, una, un\'','-ca → -che (amiche) · -co → -chi (giochi), pero amici'],e:['il libro → i libri','lo studente → gli studenti','l\'amica → le amiche','la mano → le mani'],t:'Género distinto del español: il fiore, il latte, il sale, il miele (la flor, la leche, la sal, la miel).'},
104:{r:['-are: parlo, parli, parla, parliamo, parlate, parlano','-ere: prendo, prendi, prende, prendiamo, prendete, prendono','-ire: dormo… · -isc-: capisco, capisci, capisce, capiamo, capite, capiscono','tu siempre en <b>-i</b> (nunca -s), noi siempre en <b>-iamo</b>','Negación: <b>non</b> + verbo; non… mai, non… niente'],e:['Non capisco questa parola.','Dove abiti?','Cerchi lavoro? (cercare → cerchi)','Loro PAR-la-no italiano.'],t:'«loro parlano» lleva el acento en la antepenúltima: PAR-la-no, no par-LA-no.'},
105:{r:['vado, vengo, faccio, sto, esco, dico (+ formas en la lección)','voglio, posso, devo, so + <b>infinitivo sin preposición</b>','vorrei = querría, me gustaría (más educado que voglio)','andare <b>a</b> + ciudad/infinitivo · <b>in</b> + país/transporte · <b>a</b> piedi','fare colazione (desayunar), fare la spesa (hacer la compra), fa caldo'],e:['Voglio imparare l\'italiano.','Stasera non posso uscire.','Vado in Italia in treno.','Che cosa fai domenica?'],t:'«Tengo que…» = devo… (nunca «ho che»). sapere = saber · conoscere = conocer.'},
106:{r:['Sono le tre · È l\'una · È mezzogiorno','e un quarto, e mezza, meno un quarto','¿A qué hora? Alle otto · all\'una','Días y meses en minúscula; il lunedì = todos los lunes','Reflexivos: mi sveglio, ti alzi, si veste, ci divertiamo'],e:['Mi sveglio alle sette.','Il film comincia alle nove e mezza.','Il mio compleanno è il 12 marzo.','Non vado mai in palestra.'],t:'ventuno, ventotto (sin vocal); ventitré con tilde.'},
110:{r:['<b>c\'è</b> + singular (un, una, molta gente) · <b>ci sono</b> + plural (due, molti, dei)','<b>non c\'è / non ci sono</b> · la pregunta solo cambia la entonación','¿Existe? → <b>c\'è</b> un museo (hay) · ¿Dónde está? → il museo <b>è</b>… / <b>dov\'è</b>?','Posesión → <b>avere</b>: ho due fratelli · Señalar → <b>ecco</b> le chiavi','c\'è il sole · c\'è Marco? · che c\'è? · non c\'è campo · non c\'è di che'],e:['Qui vicino c\'è una farmacia.','In centro ci sono molti negozi.','Dov\'è la stazione?','Pronto, c\'è Giulia? — No, non c\'è.'],t:'¿Hay un bar? → C\'è un bar? (nunca «ha un bar») · hay muchos turistas → CI SONO molti turisti.'},
107:{r:['<b>c\'è</b> + singular · <b>ci sono</b> + plural = hay','Dov\'è…? para algo conocido (= ¿dónde está?)','vicino a, lontano da, davanti a, accanto a, di fronte a','Indicaciones con Lei: vada dritto, giri a destra, prenda…'],e:['C\'è una farmacia qui vicino?','Ci sono tre bar nella piazza.','Scusi, dov\'è la stazione?','Vada dritto e giri a sinistra.'],t:'«Ci è» no existe: c\'è. Y con plural, ci sono.'},
109:{r:['<b>di</b>: posesión, origen con essere, material, contenido','<b>a</b>: ciudades, casa/scuola/letto, horas, personas, a + infinitivo','<b>in</b>: países, regiones, banca/ufficio/farmacia, transporte','<b>da</b>: vengo da, casa de alguien, «desde hace», finalidad','tra/fra = dentro de · fa = hace (pasado)'],e:['Abito a Lisbona da due anni.','Vado dal medico.','Lavoro in banca.','Un bicchiere di vino / un bicchiere da vino.'],t:'Vivo en Madrid → abito A Madrid · Estoy en casa → sono A casa · Voy al médico → vado DAL medico.'},
108:{r:['Lo que gusta es el sujeto, como en español: mi <b>piace</b> + singular/infinitivo, mi <b>piacciono</b> + plural','mi, ti, gli (a él), le (a ella), Le, ci, vi, gli + piace','A Marco piace… (con nombre, a)','Anche a me (a mí también) · Neanche a me (a mí tampoco)','questo / quello (quel, quello, quell\', quei, quegli)'],e:['Mi piace il caffè.','Mi piacciono i musei.','Vorrei un cappuccino, per favore.','Il conto, per favore.'],t:'«A él le gusta» → gli piace; «a ella le gusta» → le piace.'},
1:{r:['di/a/da/in/su + artículo = del, al, dal, nel, sul…','Profesionales y personas: vado <b>dal</b> medico, <b>da</b> Marco','<b>in</b> sin artículo: in banca, in ufficio, in centro','Partitivo: del pane, degli amici (= un poco de, unos)','Posesivo con artículo, salvo familiares en singular: mia madre'],e:['Le chiavi sono sul tavolo.','Vado dal dentista.','Vorrei del pane.','I miei fratelli · mia sorella'],t:'«lo» es artículo masculino (lo zio = el tío), no pronombre neutro. Y «mi libro» = IL mio libro.'},
2:{r:['passato prossimo = avere/essere + participio','<b>essere</b>: movimiento, cambio de estado, reflexivos, piacere','Con essere el participio concuerda: Maria è andata','Con avere no concuerda (salvo con pronombres)','Irregulares: fatto, detto, scritto, preso, messo, visto…'],e:['Ieri sono andata al cinema.','Abbiamo mangiato troppo.','Mi è piaciuto il film.','Le ragazze si sono divertite.'],t:'«He ido» = sono andata/o (nunca «ho andato»).'},
3:{r:['<b>imperfetto</b>: escenario, costumbre, acción en curso','<b>passato prossimo</b>: hecho terminado, interrupción','trapassato: avevo/ero + participio (el «había hecho»)','sapevo (ya lo sabía) ≠ ho saputo (me enteré)','Duración hasta hoy: presente + da'],e:['Da bambina andavo al mare.','Mentre cucinavo, è arrivato Paolo.','Quando sono arrivata, il treno era già partito.','Conosco Marco da dieci anni.'],t:'«Conozco a Paolo desde hace años» = conosco Paolo da anni, nunca «ho conosciuto».'},
4:{r:['Directos: lo, la, li, le · indirectos: gli (a él), le (a ella), Le (formal)','Combinados: me lo, te la, ce ne, <b>glielo</b> (se lo: a él/ella/ellos)','Delante del verbo conjugado; pegados al infinitivo, gerundio e imperativo','lo/la/li/le + avere: el participio concuerda (l\'ho vista)'],e:['Te lo dico domani.','Gliel\'ho dato ieri.','Le chiavi? Le ho prese.','Voglio vederla.'],t:'El «le» indirecto español → gli (masc.) o le (fem.); «se lo» → glielo.'},
5:{r:['<b>ci</b> = allí, en eso (a/su + cosa): ci vado, ci penso','<b>ne</b> = de eso, de ello (cantidad, di + cosa): ne ho due','ci vuole / ci vogliono = hace(n) falta, se tarda (impersonal)','ci metto = yo tardo · ce la faccio = puedo, lo consigo','me ne vado = me voy'],e:['Quanti figli hai? Ne ho tre.','Ci vogliono due ore.','Non ce la faccio più.','Che ne pensi?'],t:'«Tengo dos» sin ne ✗ → ne ho due.'},
6:{r:['futuro: -rò, -rai, -rà, -remo, -rete, -ranno','Probabilidad: sarà a casa (estará en casa)','condizionale: -rei, -resti, -rebbe…: vorrei, potresti','<b>Futuro en el pasado = condizionale passato</b>','Después de quando/appena con valor de futuro: futuro (no subjuntivo)'],e:['Quando arriverai, chiamami.','Vorrei un caffè.','Ha detto che sarebbe venuto.','Avrà perso il treno.'],t:'«Dijo que vendría» → ha detto che SAREBBE VENUTO (no «verrebbe»).'}
};

  if((m=h.match(/^unita-(\d+)$/)) && UNITS.find(u=>u.id==m[1])) return {type:'unit',id:+m[1]};
  if(h==='falsi-amici') return {type:'falsi'};
  if(h==='verbi') return {type:'verbi'};
  if((m=h.match(/^verbo-([a-zàèéìòù']+)$/))) return {type:'verbi',q:m[1]};
  if(h==='frasi') return {type:'frasi'};
  if(h==='ripasso') return {type:'ripasso'};
  if(h==='misto') return {type:'misto'};
  if(h==='mappa') return {type:'mappa'};
  if(h==='progressi') return {type:'progressi'};
  if(h==='diario') return {type:'diario'};
  if(h==='lessico') return {type:'lessico'};
  if(h==='cultura') return {type:'cultura'};
  if(h==='leggere') return {type:'leggere'};
  if((m=h.match(/^leggere-(\d+)$/)) && TESTI[+m[1]]) return {type:'leggere',id:+m[1]};
  if(h==='ascolto') return {type:'ascolto'};
  if((m=h.match(/^ascolto-(\d+)$/)) && ASCOLTI[+m[1]]) return {type:'ascolto',id:+m[1]};
  if(h==='parlare') return {type:'parlare'};
  if(h==='fuori') return {type:'fuori'};
  if(h==='piano') return {type:'piano'};
  if(h==='racconto') return {type:'racconto'};
  if((m=h.match(/^racconto-(\d+)$/)) && STORIA[+m[1]]) return {type:'racconto',id:+m[1]};
  if(h==='schede') return {type:'scheda'};
  if((m=h.match(/^scheda-(\d+)$/)) && SCHEDE[+m[1]] && UNITS.find(u=>u.id==m[1])) return {type:'scheda',id:+m[1]};
  if((m=h.match(/^cultura-(\d+)$/)) && CULTURA[+m[1]]) return {type:'cultura',id:+m[1]};
  if((m=h.match(/^lessico-(\d+)$/)) && LESSICO[+m[1]]) return {type:'lessico',id:+m[1]};
  if((m=h.match(/^verifica-(\d+)$/)) && TESTS.find(t=>t.id==m[1])) return {type:'test',id:+m[1]};
  return {type:'home'};
}

function mcList(ol,items,onDone,errFn){
  let answered=0,score=0;
  ol.innerHTML=items.map((it,i)=>`<li><div><div class="q">${esc(it[0])}</div><div class="opts">${it[1].map((o,j)=>`<button class="opt" data-i="${i}" data-j="${j}">${esc(o)}</button>`).join('')}</div><div class="expl" hidden></div></div></li>`).join('');
  ol.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i,j=+b.dataset.j,it=items[i];
    const li=ol.children[i];
    li.querySelectorAll('.opt').forEach((x,k)=>{ x.disabled=true; if(k===it[2]) x.classList.add('ok'); });
    if(j!==it[2]){ b.classList.add('no'); if(errFn){ const e=errFn(i); if(e) addErr(...e); } } else score++;
    tick();
    const ex=li.querySelector('.expl');
    const mark = j===it[2]?'<span class="mark ok">giusto!</span>':'<span class="mark no">no…</span>';
    ex.innerHTML=mark+(it[3]?' '+esc(it[3]):''); ex.hidden=false;
    if(++answered===items.length) onDone(score,items.length);
  }));
}

function buildSet(sec,set,letter,key,onSave,src){
  const ekey=i=>(key||('g'+hashStr(set.items[i][0])))+'-'+i;
  const prev=key&&S.ex[key];
  sec.innerHTML=`<div class="card-h"><div><span class="lab">${letter} · ${TYPE_LAB[set.t]}</span><h3>${esc(set.title)}</h3></div><span class="score">${prev?prev.s+'/'+prev.t:''}</span></div><ol class="items"></ol>
   ${set.t!=='mc'?'<div class="btnrow"><button class="btn primary" data-a="check">Correggi</button><button class="btn" data-a="show">Mostra le soluzioni</button><button class="btn" data-a="reset">Rifai</button></div>':'<div class="btnrow"><button class="btn" data-a="reset">Rifai</button></div>'}`;
  if(prev) showScore(sec.querySelector('.score'),prev.s,prev.t);
  const ol=sec.querySelector('.items');
  const record=(s,t)=>{ showScore(sec.querySelector('.score'),s,t); if(key){ S.ex[key]={s,t}; save(); onSave&&onSave(); } };
  sec.querySelector('[data-a="reset"]').onclick=()=>buildSet(sec,set,letter,key,onSave,src);
  if(set.t==='mc'){ mcList(ol,set.items,record,i=>{ const it=set.items[i]; return [ekey(i),'mc',{q:it[0],o:it[1],c:it[2],e:it[3]||''},src]; }); return; }
  if(set.t==='order'){ orderList(ol,set.items,sec,record,ekey,src); return; }

  ol.innerHTML=set.items.map((it,i)=>{
    if(set.t==='fill'){
      const multi=Array.isArray(it[1][0]);
      const answers=multi?it[1]:[it[1]];
      let txt=it[0], hint='';
      const m=txt.match(/\s*(\([^()]*\))\s*$/); if(m){ hint=m[1]; txt=txt.slice(0,m.index); }
      let bi=0;
      const html=esc(txt).replace(/___/g,()=>{ const a=answers[bi]||['']; const w=Math.max(4,...a.map(x=>x.length))+2; return `<input class="blank" data-b="${bi++}" style="width:${w}ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="lacuna">`; });
      return `<li><div><div class="sent">${html}${hint?`<span class="hint">${esc(hint)}</span>`:''}<span class="fb"></span></div><div class="expl" hidden></div></div></li>`;
    } else {
      const html=esc(it[0]).replace(/\{([^}]*)\}/,'<span class="err">$1</span>');
      const w=Math.max(10,...it[1].map(x=>x.length))+2;
      return `<li><div><div class="sent">${html}</div><div class="fixline">Correzione: <input class="blank" data-b="0" style="width:${w}ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="correzione"><span class="fb"></span></div><div class="corrected" hidden></div></div></li>`;
    }
  }).join('');

  const inputs=[...ol.querySelectorAll('.blank')];
  inputs.forEach((inp,k)=>inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ e.preventDefault(); const li=inp.closest('li'); const idx=[...ol.children].indexOf(li);
      const rowInputs=[...li.querySelectorAll('.blank')];
      if(inp===rowInputs[rowInputs.length-1]) checkRow(idx);
      const nx=inputs[k+1]; if(nx) nx.focus(); }
  }));
  const results=new Array(set.items.length).fill(null);
  function answersOf(i){ const it=set.items[i]; if(set.t==='fix') return [it[1]]; return Array.isArray(it[1][0])?it[1]:[it[1]]; }
  function checkRow(i,reveal){
    const li=ol.children[i], it=set.items[i], ans=answersOf(i);
    let rowOk=true; const notes=[];
    li.querySelectorAll('.blank').forEach(inp=>{
      const b=+inp.dataset.b; const r=judge(inp.value,ans[b]);
      inp.classList.remove('ok','no','acc');
      if(reveal && r!=='ok'){ inp.value=ans[b][0]; inp.classList.add('acc'); rowOk=false; return; }
      inp.classList.add(r);
      if(r!=='ok') rowOk=false;
      if(r==='no') notes.push(ans[b][0]);
      if(r==='acc') notes.push('accento: '+ans[b][0]);
    });
    const fb=li.querySelector('.fb');
    fb.innerHTML = reveal ? '' : (rowOk?'<span class="mark ok">✓</span>':`<span class="mark ${notes.every(n=>n.startsWith('accento'))?'acc':'no'}">${esc(notes.join(' · '))}</span>`);
    if(set.t==='fill' && it[2]){ const ex=li.querySelector('.expl'); ex.textContent=it[2]; ex.hidden=false; }
    if(set.t==='fix'){ const co=li.querySelector('.corrected'); co.textContent='✓ '+it[2]; co.hidden=false; }
    const tried=[...li.querySelectorAll('.blank')].some(x=>x.value.trim());
    if(!reveal && tried && results[i]===null) tick();
    if(!reveal && tried && !rowOk) addErr(ekey(i), set.t==='fix'?'fix':'fill', set.t==='fix'?{p:it[0],a:it[1],c:it[2]}:{p:it[0],a:it[1],e:it[2]||''}, src);
    results[i]= reveal?false:rowOk;
    if(results.every(r=>r!==null) && !reveal) record(results.filter(Boolean).length,results.length);
    return rowOk;
  }
  sec.querySelector('[data-a="check"]').onclick=()=>{ set.items.forEach((_,i)=>checkRow(i)); };
  sec.querySelector('[data-a="show"]').onclick=()=>{ set.items.forEach((_,i)=>{ if(results[i]!==true) checkRow(i,true); }); };
}

function md(t){
  const lines=esc(t).split('\n'); let out='', list=null;
  const inline=s=>s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/~~([^~]+)~~/g,'<del>$1</del>').replace(/(^|\s)_([^_]+)_/g,'$1<i>$2</i>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>');
  const close=()=>{ if(list){ out+=`</${list}>`; list=null; } };
  lines.forEach(l=>{
    let m;
    const fake=l.match(/~~([^~]+)~~\s*(?:→|-&gt;|->)\s*\*\*([^*]+)\*\*/);
    if(fake && canon(fake[1].replace(/&#39;|&apos;/g,"'"))===canon(fake[2].replace(/&#39;|&apos;/g,"'"))) return;
    if((m=l.match(/^#{1,4}\s+(.*)/))){ close(); out+=`<h4>${inline(m[1])}</h4>`; }
    else if((m=l.match(/^\s*[-*•]\s+(.*)/))){ if(list!=='ul'){close(); out+='<ul>'; list='ul';} out+=`<li>${inline(m[1])}</li>`; }
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=='ol'){close(); out+='<ol>'; list='ol';} out+=`<li>${inline(m[1])}</li>`; }
    else if(l.trim()===''){ close(); }
    else { close(); out+=`<p>${inline(l)}</p>`; }
  });
  close(); return out;
}

function checkVerb(){

/* ---------- MONTA A FRASE ---------- */
const canon=s=>norm(s).replace(/[.,!?;:«»"—–-]/g,' ').replace(/\s+/g,' ').trim();
function shuffleTokens(toks){ let s; let n=0; do{ s=shuffle(toks); n++; }while(n<8 && s.join(' ')===toks.join(' ')); return s; }
function makeOrder(box,item){
  const sentence=item[0], alts=item[1]||[];
  const toks=sentence.split(' ');
  box.innerHTML=`<div class="build" aria-label="la tua frase"><span class="ph">Tocca le parole nell'ordine giusto</span></div><div class="pool"></div><div class="fb"></div>`;
  const build=box.querySelector('.build'), pool=box.querySelector('.pool');
  shuffleTokens(toks).forEach(t=>{ const b=document.createElement('button'); b.className='tok'; b.type='button'; b.textContent=t; pool.appendChild(b); });
  const ph=build.querySelector('.ph');
  box.addEventListener('click',e=>{
    const b=e.target.closest('.tok'); if(!b||box.dataset.locked) return;
    (b.parentElement===pool?build:pool).appendChild(b);
    ph.hidden=build.querySelectorAll('.tok').length>0;
  });
  return {
    check(){
      const built=[...build.querySelectorAll('.tok')].map(x=>x.textContent).join(' ');
      const fb=box.querySelector('.fb');
      if(pool.children.length){ fb.innerHTML='<span class="mark no">mancano delle parole</span>'; return false; }
      const ok=[sentence,...alts].some(a=>canon(a)===canon(built));
      fb.innerHTML= ok?'<span class="mark ok">✓ perfetto</span>':`<span class="mark no">✗</span> <span class="corrected">${esc(sentence)}</span>`;
      build.classList.toggle('ok',ok); build.classList.toggle('no',!ok);
      return ok;
    },
    incomplete(){ return pool.children.length>0; },
    reveal(){ box.dataset.locked='1'; box.querySelector('.fb').innerHTML=`<span class="corrected">${esc(sentence)}</span>`; }
  };
}
function orderList(ol,items,sec,record,ekey,src){
  ol.innerHTML=items.map(()=>`<li><div class="ordbox"></div></li>`).join('');
  const ctrls=[...ol.querySelectorAll('.ordbox')].map((b,i)=>makeOrder(b,items[i]));
  const done=new Array(items.length).fill(false);
  sec.querySelector('[data-a="check"]').onclick=()=>{ const r=ctrls.map((c,i)=>{ const ok=c.check(); const complete=!c.incomplete(); if(complete&&!done[i]){ done[i]=true; tick(); } if(complete&&!ok&&ekey) addErr(ekey(i),'order',{s:items[i][0],al:items[i][1]||[]},src); return ok; }); record(r.filter(Boolean).length,r.length); };
  sec.querySelector('[data-a="show"]').onclick=()=>ctrls.forEach(c=>c.reveal());
}

const LV=['A2–B1','B1–B2','B2–C1'];

function labStats(){ const s=S.lab[labMode]; $('#labstats').textContent=`In questa modalità: ${s.ok} giuste su ${s.tot}.`; }
function pick(arr,prev){ if(arr.length<2) return arr[0]; let x; do{ x=arr[Math.floor(Math.random()*arr.length)]; }while(x===prev); return x; }
function nextLab(){
  const card=$('#labcard'); labStats();

    const it=pick(ALL_ORDER,labCur&&labCur.it); labCur={it,done:false};
    card.innerHTML=`<div class="card-h"><span class="lab">Unità ${it[2]} · riordina</span></div><div class="ordbox big"></div><div class="btnrow" style="margin-top:14px"><button class="btn primary" id="lcheck">Verifica</button><button class="btn" id="lnext">Prossima →</button></div>`;

    $('#lcheck').onclick=()=>{ if(labCur.done) return; const ok=ctl.check(); if(card.querySelector('.pool').children.length) return; labCur.done=true; S.lab.ord.tot++; tick(); if(ok) S.lab.ord.ok++; else addErr('lab-ord-'+hashStr(it[0]),'order',{s:it[0],al:it[1]||[]},'Laboratorio · riordina'); save(); labStats(); };
    $('#lnext').onclick=nextLab;
    return;
  }
  let it,prompt,sub;
  if(labMode==='trad'){ const pool=TRAD.filter(x=>labLvl<0||x[2]===labLvl); it=pick(pool,labCur&&labCur.it); prompt=it[0]; sub=`Traduci in italiano · ${LV[it[2]]}`; }
  else { it=pick(TRASF,labCur&&labCur.it); prompt=it[1]; sub=it[0]; }
  labCur={it,done:false};
  const answers = labMode==='trad'? it[1] : it[2];
  card.innerHTML=`<div class="card-h"><span class="lab">${esc(sub)}</span></div>
   <p class="labq">${esc(prompt)}</p>
   <textarea id="lin" class="labin" rows="2" spellcheck="false" autocapitalize="off" placeholder="Scrivi in italiano…"></textarea>
   <div id="lfb" class="fb"></div>
   <div class="btnrow" style="margin-top:12px"><button class="btn primary" id="lcheck">Verifica</button><button class="btn" id="lnext">Prossima →</button></div>
   <div id="lai"></div>`;
  const inp=$('#lin'); inp.focus({preventScroll:true});
  const doCheck=()=>{
    if(labCur.done || !inp.value.trim()) return;
    labCur.done=true;
    const v=canon(inp.value);
    const r = answers.some(a=>canon(a)===v)?'ok': answers.some(a=>canon(a).normalize('NFD').replace(/[̀-ͯ]/g,'')===v.normalize('NFD').replace(/[̀-ͯ]/g,''))?'acc':'no';
    S.lab[labMode].tot++; tick(); if(r!=='no') S.lab[labMode].ok++; save(); labStats();
    labCur.ekey='lab-'+labMode+'-'+hashStr(prompt);
    if(r==='no') addErr(labCur.ekey,'lab',{q:prompt,s:sub,a:answers,n:labMode==='trad'?(it[3]||''):''},'Laboratorio · '+(labMode==='trad'?'traduzione':'trasforma'));
    const note = labMode==='trad'&&it[3] ? `<p class="expl">${esc(it[3])}</p>`:'';
    const sols = `<div class="sols"><span class="note">Soluzioni accettate:</span><ul>${answers.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`;
    if(r==='ok') $('#lfb').innerHTML=`<span class="mark ok">Perfetto! ✓</span>${note}${answers.length>1?sols:''}`;
    else if(r==='acc') $('#lfb').innerHTML=`<span class="mark acc">Quasi: controlla gli accenti.</span>${note}${sols}`;
    else {
      $('#lfb').innerHTML=`<span class="mark no">Non corrisponde alle soluzioni previste.</span>${note}${sols}

        <div class="btnrow"><button class="btn red" id="laibtn">Fai valutare la mia frase</button><button class="btn ghost" id="lself">Era giusta: conta il punto</button></div>`;
      $('#lself').onclick=()=>{ if(labCur.credited) return; labCur.credited=true; removeErr(labCur.ekey); S.lab[labMode].ok++; save(); labStats(); $('#lself').remove(); };
      $('#laibtn').onclick=()=>labAI(prompt,sub,answers,inp.value);
    }
  };
  $('#lcheck').onclick=doCheck;
  $('#lnext').onclick=nextLab;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); labCur.done?nextLab():doCheck(); } });
}
async function labAI(prompt,task,answers,mine){
  const box=$('#lai'); const btn=$('#laibtn'); if(btn) btn.disabled=true;
  box.innerHTML=`<div class="ai-out"><div class="stamp">La professoressa sta leggendo…</div></div>`;

  if(!sample){ box.innerHTML=`<div class="ai-out"><p>La valutazione automatica funziona solo con la pagina aperta dentro Claude.</p></div>`; if(btn) btn.disabled=false; return; }
  const q=`Sei un insegnante d'italiano. Valuta la risposta di una studentessa brasiliana che parla anche spagnolo.
Compito: ${task}
Frase di partenza: ${prompt}
Soluzioni di riferimento: ${answers.join(' | ')}
Risposta della studentessa: ${mine}
La risposta può essere corretta anche se diversa dalle soluzioni, purché sia grammaticalmente corretta, naturale e fedele al senso (e, per le trasformazioni, rispetti la consegna).
Rispondi solo con JSON: {"corretta": true o false, "versione_corretta": "la sua frase corretta con il minimo di modifiche", "spiegazione": "in ${lname()}, massimo 35 parole, indicando eventuali interferenze di PT/ES"}`;
  try{
    const r=await sample.json(q);
    const ok=!!(r&&r.corretta);
    if(ok && !labCur.credited){ labCur.credited=true; removeErr(labCur.ekey); S.lab[labMode].ok++; save(); labStats(); } if(ok){ const s=$('#lself'); s&&s.remove(); }
    box.innerHTML=`<div class="ai-out"><div class="stamp">${ok?'Va bene! ✓':'Correzione'}</div>${r&&r.versione_corretta?`<p class="corrected" style="font-size:17px">${esc(r.versione_corretta)}</p>`:''}<p>${esc((r&&r.spiegazione)||'')}</p></div>`;
  }catch(e){ box.innerHTML=`<div class="ai-out"><p>${esc(errMsg(e))}</p></div>`; if(btn) btn.disabled=false; }
}

/* ---------- utilità ---------- */
function hashStr(t){ let h=5381; t=String(t); for(let i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))|0; return (h>>>0).toString(36); }
let toastT;
function toast(msg){ const t=$('#toast'); if(!t) return; t.innerHTML=msg; t.hidden=false; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>{ t.hidden=true; },300); },3200); }

/* ---------- il mio piano (calendario reale) ---------- */
const dayKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=n=>{ const d=new Date(); d.setDate(d.getDate()+n); return dayKey(d); };
const kDate=k=>{ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d,12); };
const kAdd=(k,n)=>{ const d=kDate(k); d.setDate(d.getDate()+n); return dayKey(d); };
const kFmt=(k,o)=>kDate(k).toLocaleDateString('it-IT',o||{weekday:'short',day:'numeric',month:'short'});
const WD=['dom','lun','mar','mer','gio','ven','sab'];

const INT=[1,3,7,15];
const BOXLAB=['tra 1 giorno','tra 3 giorni','tra 7 giorni','tra 15 giorni'];
function addErr(key,k,d,src){
  if(!key) return;
  const e=S.err[key];
  S.err[key]={k,d,src:src||(e&&e.src)||'',b:0,due:addDays(1),u:Date.now(),w:((e&&e.w)||0)+1};
  const ks=Object.keys(S.err); if(ks.length>600) ks.sort((a,b)=>S.err[a].u-S.err[b].u).slice(0,ks.length-600).forEach(x=>delErr(x));
  save(); refreshErrBadge();
}
function delErr(key){ if(!S.err[key]) return; delete S.err[key]; S.errDel[key]=Date.now(); }
function removeErr(key){ if(key&&S.err[key]){ delErr(key); save(); refreshErrBadge(); } }
function errDue(){ const t=dayKey(); return Object.keys(S.err).filter(k=>S.err[k].due<=t); }
function refreshErrBadge(){ const r=route(); if(r.type!=='unit') return; renderNav(r); }
function reviewResult(key,ok){
  const e=S.err[key]; if(!e) return;
  if(ok){ if(e.b>=3){ delErr(key); S.mastered=(S.mastered||0)+1; } else { e.b++; e.due=addDays(INT[e.b]); e.u=Date.now(); } }
  else { e.b=0; e.due=addDays(1); e.u=Date.now(); e.w=(e.w||0)+1; }
  save();
}
function errLabel(e){
  const d=e.d;
  switch(e.k){
    case 'fill': case 'fix': return d.p.replace(/[{}]/g,'');
    case 'mc': return d.q;
    case 'order': return d.s;
    case 'verb': return `${d.v} · ${TEMPI[d.t]} · ${PERSONE[d.p]}`;
    case 'lab': return d.q;
    case 'falso': return `Falso amico: ${d.w}`;
    case 'dict': return `Dettato: ${d.s}`;
    case 'myvoc': { const w=S.myvoc[d.k]; return w?`Le mie parole: ${w.it}`:'Le mie parole'; }
    case 'vocab': { const w=LESSICO[d.t]&&LESSICO[d.t].w[d.i]; return w?`Lessico: ${w[0]}`:'Lessico'; }
  }
  return '';
}

function reviewCard(box,e,finish){
  if(reviewExtra(box,e,finish)) return;

    const inp=box.querySelector('.blank'); inp.focus({preventScroll:true});

    else if(e.k==='falso'){ const f=FALSI.find(x=>x[0]===d.w)||FALSI[0]; o=shuffle([f[1],...shuffle(FALSI.filter(x=>x!==f)).slice(0,3).map(x=>x[1])]); q=`Che cosa significa «${f[0]}»?`; c=o.indexOf(f[1]); ex=`Attenzione: ${f[2]}. Es.: ${f[3]}`; }
    else { const th=LESSICO[d.t], w=th.w[d.i]; o=shuffle([w[0],...shuffle(th.w.filter(x=>x!==w)).slice(0,3).map(x=>x[0])]); q=`Come si dice «${w[1]}»?`; c=o.indexOf(w[0]); ex=w[2]; }
    box.innerHTML=`<div class="q rvsent">${esc(q)}</div><div class="opts">${o.map((x,j)=>`<button class="opt" data-j="${j}">${esc(x)}</button>`).join('')}</div>`;

  } else if(e.k==='order'){

    chk.onclick=()=>{ const ok=ctl.check(); if(ctl.incomplete()) return; finish(ok,''); };
  } else if(e.k==='verb'){

    box.innerHTML=`<div class="drill" style="padding:6px 0"><div class="verb" style="font-size:40px">${d.v}</div><div class="note">${esc(VERBI[d.v].pt||'')}</div><div class="meta"><b>${TEMPI[d.t]}</b></div><div class="pers">${PERSONE[d.p]}</div><input id="rvin" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;
    const inp=$('#rvin'); inp.focus({preventScroll:true});

    enterTo(inp,go); chk.onclick=go;
  }

function startTest(T){

  $('#tbody').querySelectorAll('.opts').forEach(g=>g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ g.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); testState.ans[g.dataset.g][+g.dataset.i]=+b.dataset.j; }));
  $('#tsend').onclick=$('#tsend2').onclick=()=>gradeTest(T);

function gradeTest(T){
  if(!testState||testState.result) return;
  stopTestTimer();
  const src=`${T.title}`;
  const read=T.reading.q.map((q,i)=>{ const ok=testState.ans.read[i]===q[2]; if(!ok) addErr(`t${T.id}-r-${i}`,'mc',{q:q[0],o:q[1],c:q[2],e:''},src+' · lettura'); return ok; });
  const clozeVals=[...$('#tbody').querySelectorAll('[data-c]')].sort((a,b)=>a.dataset.c-b.dataset.c).map(x=>x.value);
  const cloze=T.cloze.a.map((a,i)=>{ const ok=judge(clozeVals[i]||'',a)==='ok'; if(!ok) addErr(`t${T.id}-c-${i}`,'fill',{p:clozeSentence(T,i),a:a,e:''},src+' · testo a buchi'); return ok; });
  const mc=T.mc.map((q,i)=>{ const ok=testState.ans.mc[i]===q[2]; if(!ok) addErr(`t${T.id}-m-${i}`,'mc',{q:q[0],o:q[1],c:q[2],e:''},src+' · grammatica'); return ok; });
  const score=[...read,...cloze,...mc].filter(Boolean).length;
  const passed=score>=12;
  const prev=S.tests[T.id]||{};
  S.tests[T.id]={best:Math.max(prev.best||0,score),last:score,date:Date.now(),passed:prev.passed||passed,pdate:prev.passed?prev.pdate:(passed?Date.now():null),dist:(prev.dist||score>=17)};
  tick(20);
  save();
  testState.result={score,read,cloze,mc,clozeVals,passed};
  renderNav(route());
  showTestResult(T);
}
function clozeSentence(T,i){
  const plain=T.cloze.text.replace(/\[(\d)\]\s*(\([^)]*\))?/g,(m,n,h)=>+n-1===i?`___ ${h||''}`:T.cloze.a[+n-1][0]);
  const parts=plain.split(/(?<=[.!?»])\s+/); const p=parts.find(x=>x.includes('___'))||plain;
  const hm=p.match(/___ (\([^)]*\))/); return (hm? p.replace(hm[0],'___')+' '+hm[1] : p).trim();
}

let lexMode='lista', lexCard=null;
const lexNorm=t=>String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’`']/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
const lexAccNorm=t=>String(t).toLowerCase().replace(/[’`]/g,"'").replace(/[^a-zàèéìíòóùú' ]/g,' ').replace(/\s+/g,' ').trim();
function lexForms(w){ const out=new Set(); [w.replace(/\(.*?\)/g,''),w.replace(/[()]/g,'')].forEach(v=>v.split('/').forEach(x=>{ const f=x.replace(/[?!…]/g,'').replace(/\s+/g,' ').trim(); if(!f) return; out.add(f); out.add(f.replace(/^(il|lo|la|i|gli|le|un|uno|una)\s+/i,'').replace(/^(l'|un')/i,'')); })); return [...out]; }

const b64e=u8=>{ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); };
const b64d=str=>{ const s=atob(str); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; };
async function packState(){
  const json=JSON.stringify(Object.assign({},S,{trc:{}}));
  const raw=new TextEncoder().encode(json);
  if(typeof CompressionStream!=='undefined'){ try{ const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip')); const buf=new Uint8Array(await new Response(cs).arrayBuffer()); return 'QIT1z:'+b64e(buf); }catch(e){} }
  return 'QIT1:'+b64e(raw);
}
async function unpackState(code){
  code=String(code||'').trim().replace(/\s+/g,'');
  if(code.startsWith('{')) return JSON.parse(code);
  const m=code.match(/^QIT1(z?):(.+)$/); if(!m) throw new Error('formato');
  let bytes=b64d(m[2]);
  if(m[1]){ const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')); bytes=new Uint8Array(await new Response(ds).arrayBuffer()); }
  return JSON.parse(new TextDecoder().decode(bytes));
}
function progSummary(o){ const n=x=>Object.keys((o&&o[x])||{}).length; return `${n('lesson')} lições · ${n('ex')} séries de exercícios · ${n('myvoc')} palavras suas · ${n('diario')} páginas do diário · ${n('days')} dias de estudo`; }
