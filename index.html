<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Quaderno d'Italiano</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17213A">
<meta name="apple-mobile-web-app-title" content="Quaderno">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Caveat:wght@500;700&family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: caderno quadriculado italiano — índice à esquerda (registro), página à direita com margem vermelha; correções em "caneta vermelha". */
:root{
  --paper:#F5F7FA; --grid:#E2E8F1; --card:#FFFFFF; --ink:#17213A; --muted:#58637D; --line:#D2D9E5;
  --blu:#2741B5; --blu-soft:#E7EBFB; --rosso:#C21F2B; --rosso-soft:#FBE9EA; --verde:#1B7547; --verde-soft:#E1F2E8;
  --ambra:#8F6400; --ambra-soft:#FAF0D6; --shadow:0 1px 2px rgba(23,33,58,.06),0 6px 24px -12px rgba(23,33,58,.18);
  --f-display:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --f-read:'Source Serif 4','Iowan Old Style',Georgia,serif;
  --f-ui:'Libre Franklin',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-pen:'Caveat','Bradley Hand','Segoe Print',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F131B; --grid:#18202C; --card:#161C27; --ink:#E5E9F2; --muted:#98A2B9; --line:#2A3446;
  --blu:#8DA2FF; --blu-soft:#1D2646; --rosso:#FF7A7F; --rosso-soft:#3A1A1F; --verde:#5ACB92; --verde-soft:#14301F;
  --ambra:#E7B95A; --ambra-soft:#33290F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F131B; --grid:#18202C; --card:#161C27; --ink:#E5E9F2; --muted:#98A2B9; --line:#2A3446;
  --blu:#8DA2FF; --blu-soft:#1D2646; --rosso:#FF7A7F; --rosso-soft:#3A1A1F; --verde:#5ACB92; --verde-soft:#14301F;
  --ambra:#E7B95A; --ambra-soft:#33290F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15.5px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px;border-radius:4px}
a{color:var(--blu)}
i,em{font-style:italic}

.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);
  padding-block:22px 28px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:18px}
.brand{display:block;text-decoration:none;color:var(--ink)}
.brand b{display:block;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:30px;line-height:1;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.navgroup h4{margin:0 0 6px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.navgroup ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.navlink{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:center;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink)}
.navlink:hover{background:var(--blu-soft)}
.navlink[aria-current="page"]{background:var(--blu-soft);color:var(--blu)}
.navlink .n{font-family:var(--f-display);font-size:19px;font-weight:600;text-align:center;font-variant-numeric:lining-nums}
.navlink .t{font-size:13.5px;line-height:1.3;min-width:0}
.navlink .bar{display:block;height:3px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
.navlink .bar i{display:block;height:100%;background:var(--verde);width:0}
.navlink.tool .n{font-family:var(--f-pen);font-size:22px;color:var(--rosso)}

.topbar{display:none}
.scrim{display:none}
main{min-width:0;padding-block:34px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:860px;margin:0 auto;position:relative}

/* tipografia */
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--rosso)}
h1.title{font-family:var(--f-display);font-weight:600;font-style:italic;font-size:clamp(34px,5.4vw,54px);line-height:1.02;letter-spacing:-.015em;margin:8px 0 10px;text-wrap:balance}
.subtitle{font-size:17px;color:var(--muted);margin:0;max-width:60ch}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:28px;margin:0 0 12px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:22px;margin:28px 0 8px;text-wrap:balance}
p{margin:0 0 12px}
.lead{font-family:var(--f-read);font-size:19px;line-height:1.55;max-width:62ch}
.pen{font-family:var(--f-pen);font-weight:700;color:var(--rosso);font-size:1.35em;line-height:1}

/* cabeçalho de unidade */
.uhead{padding-bottom:18px;margin-bottom:6px}
.uprog{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.uprog .track{flex:0 1 220px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.uprog .track i{display:block;height:100%;background:var(--verde)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 26px;overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5}
.tabs button{border:0;background:none;padding:12px 14px 11px;font-size:14.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--blu);border-bottom-color:var(--blu)}
.tabs .tick{font-family:var(--f-pen);color:var(--verde);font-size:20px;line-height:0}

/* lição */
.lesson{font-size:16px}
.lesson p,.lesson li{max-width:68ch}
.tw{overflow-x:auto;margin:10px 0 16px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.tbl{border-collapse:collapse;width:100%;font-size:14.5px}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:0}
.tbl th{font-weight:600;color:var(--muted);font-size:12.5px;letter-spacing:.02em;white-space:nowrap}
.tbl td{font-family:var(--f-read)}
.tbl.c td{text-align:center}
ul.dots{padding-left:20px;margin:0 0 12px}
ul.dots li{margin:4px 0}
.chips{font-family:var(--f-read);font-style:italic;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin:8px 0 14px;line-height:1.8}
.trap,.plus{border-radius:10px;padding:14px 16px 12px;margin:16px 0;max-width:72ch}
.trap{background:var(--rosso-soft)}
.plus{background:var(--verde-soft)}
.plus .pen{color:var(--verde)}
.trap .pen,.plus .pen{display:block;margin-bottom:4px;transform:rotate(-1.5deg);transform-origin:left}
.done-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px dashed var(--line)}

/* botões */
.btn{border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:999px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--blu);color:var(--blu)}
.btn.primary{background:var(--blu);border-color:var(--blu);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0F131B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0F131B}}
.btn.red{color:var(--rosso);border-color:var(--rosso)}
.btn.red:hover{background:var(--rosso-soft);color:var(--rosso)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{border-color:transparent;background:none;padding-inline:8px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* cartão de exercício */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;margin:0 0 22px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.card-h h3{margin:0;font-size:21px}
.card-h .lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.score{font-family:var(--f-pen);font-size:28px;color:var(--rosso);line-height:1;font-variant-numeric:tabular-nums}
.score.good{color:var(--verde)}
.items{list-style:none;margin:0 0 16px;padding:0;counter-reset:it}
.items>li{counter-increment:it;display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;padding:11px 0;border-bottom:1px dashed var(--line)}
.items>li:last-child{border-bottom:0}
.items>li::before{content:counter(it);font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:16px;padding-top:1px}
.sent{font-family:var(--f-read);font-size:17px;line-height:1.9}
.sent .hint{font-family:var(--f-ui);font-size:13px;color:var(--muted);margin-left:4px}
.blank{font:inherit;font-family:var(--f-read);font-size:17px;color:var(--blu);background:transparent;border:0;border-bottom:2px dashed var(--blu);padding:0 4px;margin:0 3px;min-width:4ch;max-width:100%;border-radius:0}
.blank:focus{outline:none;background:var(--blu-soft)}
.blank.ok{border-bottom:2px solid var(--verde);color:var(--verde)}
.blank.acc{border-bottom:2px solid var(--ambra);color:var(--ambra)}
.blank.no{border-bottom:2px solid var(--rosso);color:var(--rosso);text-decoration:line-through;text-decoration-thickness:1.5px}
.mark{font-family:var(--f-pen);font-size:22px;font-weight:700;margin-left:4px;white-space:nowrap}
.mark.ok{color:var(--verde)}
.mark.no{color:var(--rosso)}
.mark.acc{color:var(--ambra)}
.expl{font-size:13.5px;color:var(--muted);margin-top:2px}
.err{text-decoration:underline wavy var(--rosso);text-decoration-thickness:1.5px;text-underline-offset:4px}
.fixline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:14px;color:var(--muted)}
.fixline .blank{min-width:12ch}
.corrected{font-family:var(--f-read);font-size:15px;margin-top:4px;color:var(--verde)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-family:var(--f-read);font-size:16px;text-align:left}
.opt:hover:not([disabled]){border-color:var(--blu)}
.opt.ok{border-color:var(--verde);background:var(--verde-soft);color:var(--verde)}
.opt.no{border-color:var(--rosso);background:var(--rosso-soft);color:var(--rosso);text-decoration:line-through}
.opt[disabled]{cursor:default}
.q{font-family:var(--f-read);font-size:17px}

/* leitura */
.reading{font-family:var(--f-read);font-size:18.5px;line-height:1.7;max-width:64ch}
.reading p{margin:0 0 14px}
.reading h2{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:32px;margin:0 0 14px;line-height:1.1}
.g{border-bottom:1.5px dotted var(--blu);cursor:help;position:relative}
.g:hover::after,.g:focus::after{content:attr(data-t);position:absolute;left:0;top:100%;margin-top:6px;z-index:20;background:var(--ink);color:var(--paper);font-family:var(--f-ui);font-size:13px;line-height:1.3;padding:6px 9px;border-radius:6px;white-space:nowrap;box-shadow:var(--shadow)}
.note{font-size:13.5px;color:var(--muted)}

/* escrita */
.task{font-family:var(--f-read);font-size:18px;max-width:64ch}
.write-grid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:18px;align-items:start}
textarea.paper{width:100%;min-height:320px;resize:vertical;font-family:var(--f-read);font-size:17px;line-height:30px;color:var(--ink);
  background-color:var(--card);background-image:linear-gradient(transparent 29px,var(--grid) 29px);background-size:100% 30px;background-attachment:local;
  border:1px solid var(--line);border-radius:12px;padding:8px 16px;box-shadow:var(--shadow)}
textarea.paper:focus{outline:2px solid var(--blu);outline-offset:1px}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13.5px}
.checklist li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:6px;align-items:start}
.checklist .bx{font-family:var(--f-pen);font-size:22px;line-height:.9;color:var(--muted);text-align:center}
.checklist li.on .bx{color:var(--verde)}
.checklist label{cursor:pointer}
.wc{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);margin:8px 0 0}
.wc b{color:var(--ink)}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.side h4{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ai-out{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-top:18px;box-shadow:var(--shadow)}
.ai-out h4{font-family:var(--f-display);font-size:20px;margin:16px 0 6px}
.ai-out h4:first-child{margin-top:0}
.ai-out ul,.ai-out ol{padding-left:20px;margin:0 0 10px}
.ai-out li{margin:4px 0}
.ai-out del{color:var(--rosso);text-decoration-thickness:1.5px}
.ai-out .stamp{font-family:var(--f-pen);color:var(--rosso);font-size:22px}
.model{font-family:var(--f-read);font-size:17px;line-height:1.7;white-space:pre-wrap;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px 18px;margin-top:14px}
.fallback textarea{width:100%;min-height:140px;font-family:var(--f-ui);font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:10px;margin-top:8px}

/* home */
.hero{padding:6px 0 26px;border-bottom:1px solid var(--line);margin-bottom:28px}
.hero h1{font-family:var(--f-display);font-weight:600;font-size:clamp(38px,6.4vw,66px);line-height:.98;letter-spacing:-.02em;margin:10px 0 16px;text-wrap:balance}
.hero h1 em{color:var(--rosso);font-weight:500}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin:22px 0 4px}
.stat b{display:block;font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.stat span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:0 0 30px}
.cols3 .card{margin:0}
.cols3 h3{margin-top:0;font-size:20px}
.plan{counter-reset:none}
.plan td:first-child{font-family:var(--f-display);font-weight:600;white-space:nowrap}
.levelmap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 30px}
.lv{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px}
.lv b{font-family:var(--f-display);font-size:22px}
.lv small{display:block;color:var(--muted);font-size:12.5px}
.lv .units{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lv .units a{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:14px}
.lv .units a.full{border-color:var(--verde);background:var(--verde-soft);color:var(--verde)}
.lv .units a.part{border-color:var(--ambra)}

/* falsi amici */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.flip{perspective:900px;height:150px;border:0;background:none;padding:0;text-align:left}
.flip .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:14px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.flip .f b{font-family:var(--f-display);font-style:italic;font-size:28px;font-weight:600}
.flip .f small{color:var(--muted);font-size:12px}
.flip .b{transform:rotateY(180deg);background:var(--blu-soft)}
.flip .b .m{font-weight:700;font-size:16px}
.flip .b .tr{font-size:12.5px;color:var(--rosso)}
.flip .b .ex{font-family:var(--f-read);font-style:italic;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card);margin-bottom:18px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blu);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0F131B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0F131B}}

/* coniugatore */
.drill{text-align:center;padding:30px 22px}
.drill .verb{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:clamp(40px,7vw,60px);line-height:1}
.drill .meta{margin:10px 0 18px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.drill .meta b{color:var(--rosso)}
.drill .pers{font-family:var(--f-read);font-size:22px;margin-bottom:6px}
.drill input{font-family:var(--f-read);font-size:24px;text-align:center;width:min(100%,340px);border:0;border-bottom:2px dashed var(--blu);background:transparent;color:var(--blu);padding:6px}
.drill input:focus{outline:none;background:var(--blu-soft)}
.drill .fb{min-height:34px;margin-top:10px}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
.chipsel button[aria-pressed="true"]{border-color:var(--blu);background:var(--blu-soft);color:var(--blu)}
.conj{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 16px;max-width:520px;margin:16px auto 0;text-align:left;font-family:var(--f-read);font-size:15px}
.conj span{color:var(--muted);font-family:var(--f-ui);font-size:12px;margin-right:6px}

/* monta a frase */
.ordbox{display:grid;gap:10px;width:100%}
.build{min-height:52px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--paper)}
.build.ok{border:1.5px solid var(--verde);background:var(--verde-soft)}
.build.no{border:1.5px solid var(--rosso);background:var(--rosso-soft)}
.build .ph{font-size:13px;color:var(--muted);padding-left:4px}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.tok{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-family:var(--f-read);font-size:17px;line-height:1.2;box-shadow:0 1px 0 var(--line)}
.tok:hover{border-color:var(--blu);color:var(--blu)}
.build .tok{background:var(--blu-soft);border-color:transparent;color:var(--blu)}
.ordbox.big .tok{font-size:19px;padding:8px 12px}
.ordbox .corrected{display:inline}

/* laboratório */
.labq{font-family:var(--f-display);font-size:clamp(24px,3.6vw,32px);font-weight:500;line-height:1.25;margin:4px 0 16px;text-wrap:balance}
.labin{width:100%;font-family:var(--f-read);font-size:19px;line-height:1.5;color:var(--blu);background:var(--paper);border:0;border-bottom:2px dashed var(--blu);border-radius:8px 8px 0 0;padding:10px 12px;resize:vertical}
.labin:focus{outline:none;background:var(--blu-soft)}
.labcard .fb{margin-top:10px}
.sols{margin-top:8px;font-family:var(--f-read);font-size:16px}
.sols ul{margin:4px 0 8px;padding-left:20px}

/* tabela de verbos */
.vsel{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);max-width:100%;flex:1 1 220px}
.vhead{margin:18px 0 16px}
.verbname{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:44px;line-height:1}
.vfacts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-family:var(--f-read);font-size:16px}
.vfacts b{font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.vt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);font-family:var(--f-read);font-size:15px;line-height:1.6}
.vt h4{margin:0 0 4px;font-family:var(--f-ui);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rosso)}
.vt span{display:inline-block;width:52px;color:var(--muted);font-family:var(--f-ui);font-size:12px}


/* ritmo, errori, verifiche, lessico */
.rhythm{display:grid;gap:6px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rhythm.met{border-color:var(--verde);background:var(--verde-soft)}
.rw-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.rw-streak{font-family:var(--f-pen);font-size:18px;line-height:1;color:var(--rosso)}
.rw-bar{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.rw-bar i{display:block;height:100%;background:var(--verde);transition:width .3s}
.topright{display:flex;gap:8px;align-items:center}
.rw-mini{font-size:13px;font-weight:600;text-decoration:none;color:var(--verde);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:999px;padding:6px 10px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--rosso);color:#fff;font-size:11.5px;font-weight:700;vertical-align:1px;margin-left:4px}
.syncline{font-size:12px;color:var(--muted);margin:auto 0 0;padding-top:8px;border-top:1px dashed var(--line)}
.syncline.ok{color:var(--verde)}
.callout{background:var(--ambra-soft);border-radius:12px;padding:14px 16px;margin-top:26px}
.callout .pen{color:var(--ambra);margin-right:6px}
.rhythm-sec{margin:0 0 30px;display:grid;gap:14px}
.rhythm-sec .card{margin:0}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.rgrid .card{display:grid;gap:8px;align-content:start;margin:0}
.big{font-family:var(--f-display);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.big small{font-size:.45em;color:var(--muted);font-weight:500}
.card.today.met{background:var(--verde-soft);border-color:var(--verde)}
.card.due{border-color:var(--rosso)}
.hmwrap{overflow-x:auto}
.hmgrid,.hmmonths{display:grid;gap:3px;grid-auto-columns:14px}
.hmgrid{grid-template-rows:repeat(7,14px);grid-auto-flow:column}
.hmmonths{font-size:11px;color:var(--muted);margin-bottom:4px;height:14px}
.hmmonths span{white-space:nowrap}
.hm{display:block;width:14px;height:14px;border-radius:3px;background:var(--line)}
.hm.l1{background:color-mix(in srgb,var(--verde) 25%,var(--card))}
.hm.l2{background:color-mix(in srgb,var(--verde) 50%,var(--card))}
.hm.l3{background:color-mix(in srgb,var(--verde) 75%,var(--card))}
.hm.l4{background:var(--verde)}
.hmleg{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);margin-top:10px}
.hmleg span{margin:0 4px}
.testrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.testchip{display:grid;gap:2px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.testchip:hover{border-color:var(--blu)}
.testchip b{font-family:var(--f-display);font-size:19px}
.testchip span{font-size:12.5px;color:var(--muted)}
.testchip em{font-style:normal;font-size:13px;font-weight:600;color:var(--blu)}
.testchip.passed{border-color:var(--verde);background:var(--verde-soft)}
.testchip.passed em{color:var(--verde)}
.testchip.lex em{color:var(--rosso)}
.boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 22px}
.box{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;background:var(--card)}
.box b{font-family:var(--f-display);font-size:26px}
.errlist{list-style:none;margin:0;padding:0}
.errlist li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.errlist li>div{min-width:0}
.el-t{font-family:var(--f-read);font-size:16px}
.due-t{color:var(--rosso)}
.rvsent{font-size:19px;margin-bottom:6px}
.opt.sel{border-color:var(--blu);background:var(--blu-soft);color:var(--blu)}
.timer{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:18px;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.timer b{font-size:20px}
.timer.low b{color:var(--rosso)}
.cloze{line-height:2.3}
.tblank{white-space:nowrap}
.tblank sup{font-family:var(--f-ui);font-size:11px;color:var(--rosso);font-weight:700;margin-right:1px}
.result.pass{border-color:var(--verde)}
.cert{margin:8px 0 22px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.cert-in{border:3px double var(--blu);padding:30px 22px;text-align:center;display:grid;gap:8px;justify-items:center;font-family:var(--f-read);font-size:17px}
.cert-t{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:clamp(40px,7vw,58px);line-height:1;color:var(--blu)}
.cert-name{font-family:var(--f-display);font-style:italic;font-size:30px;text-align:center;border:0;border-bottom:1.5px solid var(--ink);background:transparent;color:var(--ink);width:min(100%,420px);padding:4px}
.cert-name:focus{outline:none;border-bottom-color:var(--blu)}
.cert-foot{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:460px;margin-top:10px;font-size:14px;color:var(--muted)}
.seal{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;border:2px solid var(--rosso);color:var(--rosso);font-family:var(--f-display);font-weight:700;font-size:18px;transform:rotate(-12deg)}
.lexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.lexcard{text-decoration:none;color:var(--ink);display:grid;gap:8px;margin:0}
.lexcard h3{margin:0}
.lexcard:hover{border-color:var(--blu)}
.lextbl td{vertical-align:middle}
.lextbl td.pt{font-family:var(--f-ui);font-size:14px;color:var(--muted)}
.btn.kn{color:var(--verde)}
.lexflip{display:block;width:min(100%,460px);height:220px;margin:0 auto}
.lexflip .f b{font-size:34px}
.lexflip .b .m{font-size:20px}
.lexflip .b .ex{font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;transition:opacity .3s,transform .3s;z-index:60;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);font-size:15px;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .pen{color:var(--ambra);margin-right:4px}
@media (max-width: 700px){ .rgrid{grid-template-columns:minmax(0,1fr)} .boxes{grid-template-columns:repeat(2,minmax(0,1fr))} }


/* A1 e cultura */
.navlink .n.sm{font-size:14px;font-family:var(--f-ui);font-weight:700;letter-spacing:.02em}
.levelmap{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.lv .units a{width:auto;min-width:30px;padding:0 6px;border-radius:999px}
.btn.speak{font-size:13px;padding:6px 12px;margin:0 0 12px}
.btn.speak[aria-pressed="true"]{border-color:var(--rosso);color:var(--rosso)}
.reading.cult{display:grid;gap:4px}
.cpar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:start;padding:6px 0;border-bottom:1px dashed var(--line)}
.cpar>p{margin:0}
.cpar .ptbtn{font-size:12px;padding:4px 8px;color:var(--muted)}
.cpar .pt{grid-column:1 / -1;font-family:var(--f-ui);font-size:14.5px;line-height:1.55;color:var(--muted);background:var(--paper);border-left:3px solid var(--verde);padding:8px 12px;margin:6px 0 4px;border-radius:0 8px 8px 0}
.sapevi{background:var(--ambra-soft);border-color:transparent;box-shadow:none}
.sapevi .pen{color:var(--ambra);font-size:1.5em}
.cultrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.cultchip{display:grid;gap:3px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.cultchip:hover{border-color:var(--blu)}
.cultchip b{font-family:var(--f-display);font-size:17px;line-height:1.2}
.cultchip em{font-style:normal;font-size:12.5px;color:var(--verde);font-weight:600}
.cultchip.done{border-color:var(--verde)}


/* ascolto e parlato */
.rate{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.rate button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.rate button[aria-pressed="true"]{border-color:var(--blu);background:var(--blu-soft);color:var(--blu)}
.ractl{margin-bottom:6px}
.ratext{margin-top:10px}
.snt{cursor:pointer;border-radius:4px;transition:background .15s}
.snt:hover{background:var(--blu-soft)}
.snt.on{background:var(--ambra-soft);box-shadow:0 0 0 2px var(--ambra-soft)}
.snt.you{background:var(--verde-soft);box-shadow:0 0 0 2px var(--verde-soft)}
.ratimer{display:flex;align-items:center;gap:16px;margin:12px 0;padding:12px 14px;border:1px dashed var(--blu);border-radius:12px;background:var(--blu-soft)}
.wpm{font-size:15px;margin:10px 0 0;font-variant-numeric:tabular-nums}
.wpm b{font-family:var(--f-display);font-size:24px;color:var(--verde)}
.phr{list-style:none;margin:0;padding:0}
.phr li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.phr li:last-child{border-bottom:0}
.phr-it{font-family:var(--f-read);font-size:17px}
.btn.play{width:34px;height:34px;padding:0;justify-content:center;border:1px solid var(--line);border-radius:50%;font-size:12px}
.btn.said{font-size:12.5px}
.callout.small{font-size:14px;padding:10px 14px;margin:0 0 14px}
.voicenote{margin:-4px 0 14px;font-size:12.5px}
.dict .peek{font-family:var(--f-read);font-size:18px;padding:8px 12px;background:var(--ambra-soft);border-radius:8px;margin:8px 0}
.dict textarea{margin-top:10px}
.dline{font-family:var(--f-read);font-size:18px;line-height:1.8;margin:8px 0 4px}
.dw.ok{color:var(--verde)}
.dw.acc{color:var(--ambra);text-decoration:underline wavy var(--ambra)}
.dw.no{color:var(--rosso);text-decoration:underline wavy var(--rosso);font-weight:600}
.transcript{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-top:14px;font-size:17px}
.tl{margin:0 0 6px}
.tl-A{color:var(--ink)}
.tl-B{color:var(--blu)}
.tl-N{font-style:italic}
.cols4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:0 0 30px}
.cols4 .card{margin:0}
.tipcard{background:var(--blu-soft);border-color:transparent;box-shadow:none}
.tipcard .pen{color:var(--blu);display:block;margin-bottom:4px}
button.lexcard{text-align:left;font:inherit;cursor:pointer;width:100%}
.chatbox{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:240px;max-height:56vh;overflow-y:auto}
.bub{max-width:86%;padding:10px 14px;border-radius:14px;font-family:var(--f-read);font-size:17px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.bub>div{min-width:0}
.bub.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--blu-soft);color:var(--ink);border-bottom-right-radius:4px;flex-direction:column}
.bub.sys{align-self:center;font-family:var(--f-ui);font-size:13px;color:var(--muted);background:none;padding:4px}
.bub .corr{font-size:15px;color:var(--rosso);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.bub .corr .pen{font-size:20px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0;min-height:4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-family:var(--f-read);font-size:15px;text-align:left}
.chip:hover{border-color:var(--blu);color:var(--blu)}
.chatin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end;margin-top:10px}
label.chk{display:inline-flex;gap:6px;align-items:center}
.oq{font-family:var(--f-read);font-weight:400;font-size:19px;line-height:1.45}
.verb.talk{color:var(--rosso)}
.selfev{display:grid;gap:6px;margin-top:10px;max-width:420px}
.evrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mvform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mvform input,.mvform select{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);min-width:0}
.drill input#mvin,.drill input#nin{font-family:var(--f-read);font-size:24px;text-align:center;width:min(100%,340px);border:0;border-bottom:2px dashed var(--blu);background:transparent;color:var(--blu);padding:6px}
.vlinks{display:grid;gap:6px;font-size:14px}
@media (max-width: 520px){ .phr li{grid-template-columns:auto minmax(0,1fr)} .phr li .said{grid-column:2} .bub{max-width:94%} }


/* mappa delle preposizioni */
.prepmap{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:16px 0 8px}
.pm{border-radius:12px;padding:14px 14px 10px;border:1px solid var(--line);background:var(--card);display:grid;gap:4px;align-content:start}
.pm>b{font-family:var(--f-display);font-size:34px;line-height:1}
.pm>span{font-size:12.5px;color:var(--muted)}
.pm ul{margin:6px 0 0;padding-left:16px;font-family:var(--f-read);font-size:15px;line-height:1.55}
.pm-di{border-top:4px solid var(--blu)} .pm-di>b{color:var(--blu)}
.pm-a{border-top:4px solid var(--verde)} .pm-a>b{color:var(--verde)}
.pm-in{border-top:4px solid var(--ambra)} .pm-in>b{color:var(--ambra)}
.pm-da{border-top:4px solid var(--rosso)} .pm-da>b{color:var(--rosso)}


/* racconto e schede */
.ulinks{margin-top:12px}
.ulinks .btn{font-size:13px;padding:7px 12px}
.storycard{display:grid;gap:6px;text-decoration:none;color:var(--ink);border-left:4px solid var(--rosso);margin-top:4px}
.storycard:hover{border-color:var(--rosso);background:var(--rosso-soft)}
.storycard h3{margin:0;font-style:italic}
.story-hero{padding:6px 0 22px;border-bottom:1px solid var(--line);margin-bottom:20px}
.story-hero .title{font-size:clamp(40px,7vw,64px)}
.chapters{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:6px}
.chapters a{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none;color:var(--ink)}
.chapters a:hover{border-color:var(--blu)}
.chapters .cn{font-family:var(--f-display);font-size:24px;font-weight:600;color:var(--rosso);text-align:center}
.chapters .ct{display:grid;min-width:0}
.chapters .ct b{font-family:var(--f-read);font-size:17px;font-weight:600}
.chapters .ct small{font-size:12.5px;color:var(--muted)}
.chapters li.read a{border-color:var(--verde);background:var(--verde-soft)}
.storytext .ratext{font-size:19px}
.story-banner{display:grid;gap:6px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:5px solid var(--rosso);border-radius:14px;padding:18px 20px;margin:0 0 30px;box-shadow:var(--shadow)}
.story-banner b{font-family:var(--f-display);font-style:italic;font-size:32px;font-weight:600;line-height:1.05}
.story-banner span:not(.lab){font-family:var(--f-read);font-size:16px;color:var(--muted);max-width:60ch}
.story-banner em{font-style:normal;font-weight:600;color:var(--rosso)}
.story-banner:hover{border-color:var(--rosso)}
.srules{margin:0;padding-left:22px;display:grid;gap:8px;font-size:16px}
.srules li::marker{font-family:var(--f-display);font-weight:600;color:var(--rosso)}


/* il mio piano */
.todayplan{margin:0 0 14px;border-left:5px solid var(--blu)}
.todayplan.met{border-left-color:var(--verde);background:var(--verde-soft)}
.todayplan h3{margin:0}
.ptl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pt{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.pt a{color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.35;min-width:0}
.pt a:hover{color:var(--blu)}
.ptchk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:14px;font-weight:700;color:#fff;display:grid;place-items:center;padding:0}
.pt.ok{background:var(--verde-soft);border-color:transparent}
.pt.ok .ptchk{background:var(--verde);border-color:var(--verde)}
:root[data-theme="dark"] .pt.ok .ptchk{color:#0F131B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pt.ok .ptchk{color:#0F131B}}
.pt.ok a{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--verde)}
.pt.late{border-color:var(--rosso);background:var(--rosso-soft)}
.ptm{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.weeknav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 12px}
.weeknav b{font-family:var(--f-display);font-size:20px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wday{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px;display:grid;gap:8px;align-content:start;min-width:0}

<script>
const UNITS = [
/* ───────────────────────── UNITÀ 1 ───────────────────────── */
{
id:1, lvl:'A2 → B1', band:0,
title:'Articoli e preposizioni articolate',
sub:'O esqueleto de qualquer frase: il / lo / gli, del, nello, dal…',
focus:'articoli determinativi (il, lo, l\', la, i, gli, le), preposizioni articolate, partitivo, possessivi con articolo',
lesson:`
<p class="lead">Em italiano o artigo depende do <em>som inicial</em> da palavra seguinte, e as preposições se fundem com ele muito mais do que em português. Parece detalhe, mas aparece em todas as frases: vale a pena automatizar logo.</p>
<h3>Artigos definidos</h3>
<div class="tw"><table class="tbl">
<tr><th></th><th>diante de consoante</th><th>s + consoante, z, gn, ps, x, y</th><th>diante de vogal</th></tr>
<tr><th>masc. sing.</th><td>il libro</td><td>lo studente, lo zaino, lo psicologo</td><td>l'amico</td></tr>
<tr><th>masc. pl.</th><td>i libri</td><td>gli studenti, gli zaini</td><td>gli amici</td></tr>
<tr><th>fem. sing.</th><td>la casa</td><td>la studentessa</td><td>l'amica</td></tr>
<tr><th>fem. pl.</th><td>le case</td><td>le studentesse</td><td>le amiche</td></tr>
</table></div>
<p>Indefinidos seguem a mesma lógica: <i>un libro, uno zaino, un amico</i> (sem apóstrofo no masculino!), <i>una casa, un'amica</i>.</p>
<h3>Preposições articuladas</h3>
<div class="tw"><table class="tbl c">
<tr><th></th><th>il</th><th>lo</th><th>l'</th><th>la</th><th>i</th><th>gli</th><th>le</th></tr>
<tr><th>di</th><td>del</td><td>dello</td><td>dell'</td><td>della</td><td>dei</td><td>degli</td><td>delle</td></tr>
<tr><th>a</th><td>al</td><td>allo</td><td>all'</td><td>alla</td><td>ai</td><td>agli</td><td>alle</td></tr>
<tr><th>da</th><td>dal</td><td>dallo</td><td>dall'</td><td>dalla</td><td>dai</td><td>dagli</td><td>dalle</td></tr>
<tr><th>in</th><td>nel</td><td>nello</td><td>nell'</td><td>nella</td><td>nei</td><td>negli</td><td>nelle</td></tr>
<tr><th>su</th><td>sul</td><td>sullo</td><td>sull'</td><td>sulla</td><td>sui</td><td>sugli</td><td>sulle</td></tr>
</table></div>
<p><i>Con</i> e <i>per</i> normalmente não se fundem: <i>con il treno, per la strada</i>.</p>
<h3>Partitivo: "um pouco de", "alguns"</h3>
<p><i>di</i> + artigo indica quantidade indeterminada: <i>Vorrei <b>del</b> pane</i> (quero pão), <i>Ho conosciuto <b>degli</b> studenti brasiliani</i> (alguns estudantes). Nas negativas some: <i>Non ho pane</i>.</p>
<h3>Possessivos levam artigo</h3>
<p>Como no português de Portugal: <i>il mio libro, la tua casa, i nostri amici</i>. Exceção: parentes no singular, sem adjetivo nem diminutivo → <i>mia madre, tuo fratello</i>. Mas: <i>i miei fratelli, la mia sorellina, la loro madre</i> (<i>loro</i> sempre com artigo).</p>
<div class="trap"><span class="pen">Attenzione!</span> Ir à casa ou ao consultório de alguém usa <b>da</b>: <i>vado dal medico, vado da Marco</i> (ES <i>al médico</i>, PT <i>ao médico</i>). Lugares "institucionais" usam <b>in</b> sem artigo: <i>in banca, in ufficio, in biblioteca, in centro, in montagna</i>. Cidades com <b>a</b> (<i>a Roma</i>), países com <b>in</b> (<i>in Italia</i>), países plurais com artigo (<i>negli Stati Uniti</i>).</div>
<div class="trap"><span class="pen">Per chi parla spagnolo</span> <b>lo</b> não é neutro: é artigo masculino (<i>lo zio</i>). E <b>gli</b> é o plural masculino, nada a ver com o <i>le</i> indireto do espanhol.</div>
`,

{
id:2, lvl:'A2 → B1', band:0,
title:'Passato prossimo: essere o avere?',
sub:'O erro número 1 de quem fala espanhol e português.',
focus:'passato prossimo, scelta dell\'ausiliare essere/avere, accordo del participio, participi irregolari',
lesson:`
<p class="lead">Espanhol e português usam um só auxiliar (<i>haber</i>, <i>ter</i>). O italiano usa dois, e escolher o errado soa imediatamente estrangeiro. A boa notícia: a regra é bastante previsível.</p>
<h3>Quem usa <b>essere</b></h3>
<ul class="dots">
<li>Verbos de movimento com destino ou origem: <i>andare, venire, arrivare, partire, uscire, entrare, tornare, cadere</i>.</li>
<li>Mudança de estado: <i>nascere, morire, diventare, crescere, invecchiare, aumentare, dimagrire</i>.</li>
<li>Estado/permanência: <i>essere, stare, restare, rimanere</i>.</li>
<li>Todos os reflexivos: <i>mi sono svegliata, ci siamo divertiti</i>.</li>
<li><i>piacere, sembrare, succedere, costare, bastare, mancare, durare, servire</i>.</li>
</ul>
<p>Os transitivos (com objeto direto) usam <b>avere</b>: <i>ho mangiato, ho visto, ho scritto</i>. Também alguns intransitivos de atividade: <i>ho dormito, ho camminato, ho lavorato, ho viaggiato</i>.</p>
<h3>Concordância do particípio</h3>
<p>Com <b>essere</b>, o particípio concorda com o sujeito: <i>Maria è andat<b>a</b>, le ragazze sono uscit<b>e</b>, i prezzi sono aumentat<b>i</b></i>. Com <b>avere</b>, fica invariável: <i>Maria ha mangiat<b>o</b></i> (ver unidade 4 para a exceção com pronomes).</p>
<h3>Verbos com os dois auxiliares</h3>
<p>Mudam conforme tenham objeto: <i>Ho finito il lavoro</i> / <i>Il film è finito</i>; <i>Ho salito le scale</i> / <i>Sono salita sul treno</i>; <i>Ho cambiato casa</i> / <i>Sei cambiata tanto!</i> Igual para <i>cominciare, passare, correre, scendere</i>.</p>
<h3>Particípios irregulares que mais aparecem</h3>
<div class="chips">fatto · detto · scritto · letto · preso · messo · visto · aperto · chiuso · chiesto · risposto · rimasto · scelto · spento · acceso · vinto · perso · corso · nato · morto · vissuto · successo · rotto · deciso · sceso · offerto · speso · tradotto · promesso · discusso</div>
<div class="trap"><span class="pen">Attenzione!</span> <i>Mi è piaciuto il film / Mi sono piaciuti i film</i>: o particípio concorda com aquilo que agrada, que é o sujeito gramatical.</div>
<div class="plus"><span class="pen">Vantaggio</span> Uso: no norte e no italiano padrão, o <i>passato prossimo</i> cobre o nosso pretérito perfeito simples (<i>ieri ho fatto</i> = ontem fiz). O <i>passato remoto</i> fica para textos escritos e para o Sul (unidade 12).</div>
`,

/* ───────────────────────── UNITÀ 3 ───────────────────────── */
{
id:3, lvl:'A2 → B1', band:0,
title:'Imperfetto, passato prossimo e trapassato',
sub:'Contar histórias: cenário, ação e o que tinha acontecido antes.',
focus:'contrasto imperfetto / passato prossimo, trapassato prossimo, stare + gerundio, verbi che cambiano significato (sapere, conoscere, dovere)',
lesson:`
<p class="lead">Aqui você já joga em casa: a lógica imperfeito/perfeito é a mesma do espanhol e do português. A diferença é só que o "perfeito" italiano é composto (<i>ho fatto</i> = fiz).</p>
<div class="tw"><table class="tbl">
<tr><th>Imperfetto</th><th>Passato prossimo</th></tr>
<tr><td>cenário, descrição: <i>Era tardi e pioveva</i></td><td>ação concluída: <i>È arrivato alle dieci</i></td></tr>
<tr><td>hábito: <i>Da piccola andavo al mare</i></td><td>vez única ou contada: <i>Ci sono andata tre volte</i></td></tr>
<tr><td>ação em curso interrompida: <i>Mentre cucinavo…</i></td><td>…a interrupção: <i>…è suonato il telefono</i></td></tr>
<tr><td>duração sem limite</td><td>duração delimitada: <i>Ha piovuto tutto il giorno</i></td></tr>
</table></div>
<h3>Formas</h3>
<p>-<b>avo</b>/-<b>evo</b>/-<b>ivo</b>, -vi, -va, -vamo, -vate, -vano. Irregulares: <i>essere → ero, eri, era, eravamo, eravate, erano</i>; <i>fare → facevo</i>; <i>dire → dicevo</i>; <i>bere → bevevo</i>; <i>tradurre → traducevo</i>.</p>
<p><b>Stare + gerundio</b> no imperfetto para ação em andamento: <i>Stavo uscendo quando mi hai chiamato.</i></p>
<h3>Trapassato prossimo: o passado do passado</h3>
<p>Imperfetto de <i>avere/essere</i> + particípio: <i>Quando siamo arrivati, il treno <b>era già partito</b></i>. Corresponde ao PT <i>tinha partido</i> e ao ES <i>había salido</i>, com a mesma escolha de auxiliar da unidade 2.</p>
<h3>Verbos que mudam de sentido</h3>
<div class="tw"><table class="tbl">
<tr><th></th><th>imperfetto</th><th>passato prossimo</th></tr>
<tr><th>sapere</th><td><i>Sapevo</i> = já sabia</td><td><i>Ho saputo</i> = fiquei sabendo</td></tr>
<tr><th>conoscere</th><td><i>Conoscevo Anna</i> = já a conhecia</td><td><i>Ho conosciuto Anna</i> = fui apresentada a ela</td></tr>
<tr><th>dovere</th><td><i>Dovevo partire</i> = era para partir (talvez não tenha ido)</td><td><i>Sono dovuta partire</i> = tive que partir (e parti)</td></tr>
<tr><th>potere</th><td><i>Potevo aiutarti</i> = teria sido possível</td><td><i>Ho potuto aiutarti</i> = consegui</td></tr>
</table></div>
<div class="trap"><span class="pen">Attenzione!</span> Duração até o presente usa <b>presente + da</b>: <i>Conosco Paolo da dieci anni</i>, <i>Studio italiano da tre mesi</i>. Não use passato prossimo aqui.</div>
`,

<p>Un'estate, però, è successa una cosa che non ho mai dimenticato. Era una sera di agosto e faceva un caldo terribile. Stavamo cenando in giardino quando all'improvviso è andata via la luce in tutto il paese. Io avevo paura del buio, ma la nonna ha acceso una candela, ha preso la [[fisarmonica|acordeão, sanfona]] che il nonno le aveva regalato da giovane e ha cominciato a suonare. In pochi minuti sono arrivati i vicini, ognuno con qualcosa da mangiare o da bere. Abbiamo ballato fino a mezzanotte. Ancora oggi, quando manca la luce, penso a quella sera.</p>`,

/* ───────────────────────── UNITÀ 4 ───────────────────────── */
{
id:4, lvl:'B1', band:0,
title:'Pronomi diretti, indiretti e combinati',
sub:'Glielo, me ne, te la: o italiano adora juntar pronomes.',
focus:'pronomi diretti (lo, la, li, le), indiretti (gli, le, Le), pronomi combinati (me lo, glielo), posizione, accordo del participio con lo/la/li/le',
lesson:`
<div class="tw"><table class="tbl">
<tr><th></th><th>direto</th><th>indireto</th><th>combinado com lo / la / li / le / ne</th></tr>
<tr><th>io</th><td>mi</td><td>mi</td><td><b>me</b> lo, me la, me ne</td></tr>
<tr><th>tu</th><td>ti</td><td>ti</td><td><b>te</b> lo, te la, te ne</td></tr>
<tr><th>lui</th><td>lo</td><td>gli</td><td><b>glielo</b>, gliela, glieli, gliele, gliene</td></tr>
<tr><th>lei / Lei</th><td>la / La</td><td>le / Le</td><td><b>glielo</b>, gliela… (iguais!)</td></tr>
<tr><th>noi</th><td>ci</td><td>ci</td><td><b>ce</b> lo, ce la, ce ne</td></tr>
<tr><th>voi</th><td>vi</td><td>vi</td><td><b>ve</b> lo, ve la, ve ne</td></tr>
<tr><th>loro</th><td>li / le</td><td>gli (loro, formal, depois do verbo)</td><td><b>glielo</b>…</td></tr>
</table></div>
<p>O indireto vem <b>primeiro</b> e o <i>i</i> vira <i>e</i>: <i>mi + lo → me lo</i>. Com <i>gli/le</i> tudo vira uma palavra só: <i>Il libro? <b>Gliel'</b>ho dato</i> (a ele, a ela ou a eles).</p>
<h3>Posição</h3>
<ul class="dots">
<li>Antes do verbo conjugado: <i>Lo vedo domani. Te lo dico.</i></li>
<li>Colado ao infinitivo, gerúndio e imperativo (tu/noi/voi): <i>Voglio veder<b>lo</b>, vedendo<b>lo</b>, guarda<b>lo</b>!</i></li>
<li>Com verbos modais, as duas posições: <i>Lo voglio vedere = Voglio vederlo</i>.</li>
</ul>
<h3>Concordância com o particípio</h3>
<p>Com <i>lo, la, li, le</i> antes do <i>avere</i>, o particípio concorda: <i>La torta? L'ho mangiat<b>a</b>. Le chiavi? Le ho pres<b>e</b>.</i> Com <i>ne</i> também: <i>Di mele, ne ho mangiat<b>e</b> tre.</i></p>
<div class="trap"><span class="pen">Per chi parla spagnolo</span> o <i>le</i> indireto espanhol corresponde a <b>gli</b> (masc.) ou <b>le</b> (fem.). E o <i>se lo</i> espanhol vira <b>glielo</b>: <i>se lo di → gliel'ho dato</i>.</div>
<div class="trap"><span class="pen">Per chi parla portoghese</span> não existe próclise/ênclise livre: com verbo conjugado o pronome vem sempre antes (<i>Ti amo</i>, nunca "amo-ti"). E <i>lhe</i> → <i>gli/le</i>.</div>
`,

{
id:5, lvl:'B1', band:0,
title:'Ci e ne',
sub:'Duas palavrinhas sem equivalente em espanhol e português.',
focus:'particella ci (luogo, a/su qualcosa), particella ne (partitivo, di/da qualcosa), verbi pronominali volerci, metterci, farcela, andarsene, entrarci',
lesson:`
<p class="lead">Quem sabe francês reconhece <i>y</i> e <i>en</i>. Para nós, <b>ci</b> e <b>ne</b> são a maior novidade do italiano intermediário, e omiti-los é o que mais denuncia o falante de espanhol/português.</p>
<h3>CI</h3>
<ul class="dots">
<li><b>Lugar</b> (= lá, aí): <i>Vai a Roma? Sì, <b>ci</b> vado domani.</i> <i>Ci sono stata due volte.</i></li>
<li><b>a / su + coisa</b>: <i>Pensi al viaggio? Sì, <b>ci</b> penso sempre.</i> <i>Non <b>ci</b> credo! Ci conto.</i></li>
<li><b>Esserci</b>: <i>c'è, ci sono</i> (há, existe).</li>
</ul>
<h3>NE</h3>
<ul class="dots">
<li><b>Partitivo</b> (quantidade): <i>Quanti figli hai? <b>Ne</b> ho due.</i> <i>Vuoi del vino? No, grazie, non <b>ne</b> voglio.</i></li>
<li><b>di + coisa</b>: <i>Che <b>ne</b> pensi?</i> (o que você acha disso?) <i><b>Ne</b> parliamo dopo.</i></li>
<li><b>da + lugar</b>: <i>Sono entrata in banca e <b>ne</b> sono uscita dopo un'ora.</i></li>
</ul>
<h3>Verbos com ci / ne que você vai ouvir sempre</h3>
<div class="tw"><table class="tbl">
<tr><td><b>volerci</b></td><td>levar / ser preciso (impessoal)</td><td><i>Ci vuole un'ora. Ci vogliono due ore.</i></td></tr>
<tr><td><b>metterci</b></td><td>demorar (alguém)</td><td><i>Ci metto venti minuti a piedi.</i></td></tr>
<tr><td><b>farcela</b></td><td>conseguir, dar conta</td><td><i>Ce la faccio! Non ce la faccio più.</i></td></tr>
<tr><td><b>andarsene</b></td><td>ir embora</td><td><i>Me ne vado. Se n'è andata.</i></td></tr>
<tr><td><b>entrarci</b></td><td>ter a ver</td><td><i>Questo non c'entra niente.</i></td></tr>
<tr><td><b>starci</b></td><td>aceitar, topar</td><td><i>Una pizza stasera? Ci sto!</i></td></tr>
<tr><td><b>fregarsene</b></td><td>não estar nem aí (coloquial)</td><td><i>Me ne frego.</i></td></tr>
</table></div>
<div class="trap"><span class="pen">Attenzione!</span> "Tenho dois" não existe sem <b>ne</b>: <i>Ho due</i> ✗ → <i><b>Ne</b> ho due</i> ✓. E "levar tempo": <i>ci vuole</i> (impessoal) ≠ <i>ci metto</i> (eu demoro).</div>
<div class="plus"><span class="pen">Combinações</span> <i>ci + ne → ce n'è, ce ne sono</i>; <i>mi + ne → me ne</i>; <i>ci + la → ce la</i>.</div>
`,

{
id:6, lvl:'B1', band:0,
title:'Futuro e condizionale',
sub:'Inclusive a grande armadilha: "disse que viria" = disse che sarebbe venuto.',
focus:'futuro semplice e anteriore, futuro di probabilità, condizionale presente e passato, futuro nel passato (condizionale passato), condizionale giornalistico',
lesson:`
<h3>Futuro</h3>
<p>-<b>rò</b>, -rai, -rà, -remo, -rete, -ranno. Em -are o <i>a</i> vira <i>e</i>: <i>parlerò</i>. Irregulares: <i>andrò, avrò, dovrò, potrò, saprò, vedrò, vivrò</i> · <i>berrò, rimarrò, terrò, verrò, vorrò</i> · <i>sarò, farò, darò, starò</i>.</p>
<ul class="dots">
<li><b>Probabilidade</b> no presente: <i>Saranno le otto</i> = devem ser oito horas. <i>Avrà fame</i> = deve estar com fome.</li>
<li><b>Futuro anteriore</b> (avrò/sarò + particípio): ação futura anterior a outra, e probabilidade no passado: <i>Avrà perso il treno</i> = deve ter perdido o trem.</li>
</ul>
<div class="trap"><span class="pen">Attenzione!</span> Depois de <i>quando, appena, se</i> com valor futuro, o italiano usa <b>futuro</b>: <i>Quando <b>arriverai</b>, chiamami</i>. ES usa subjuntivo (<i>cuando llegues</i>), PT o futuro do subjuntivo (<i>quando chegares</i>). Nenhum dos dois funciona em italiano.</div>
<h3>Condizionale</h3>
<p>-<b>rei</b>, -resti, -rebbe, -remmo, -reste, -rebbero (mesmo radical do futuro): <i>vorrei, potresti, sarebbe</i>.</p>
<ul class="dots">
<li>Cortesia: <i>Vorrei un caffè. Potrebbe aiutarmi?</i></li>
<li>Conselho: <i>Dovresti dormire di più.</i></li>
<li>Notícia não confirmada (jornalístico): <i>Il ministro <b>si sarebbe dimesso</b></i> = teria se demitido.</li>
</ul>
<h3>O futuro no passado</h3>
<div class="tw"><table class="tbl">
<tr><th>Espanhol</th><th>Português</th><th>Italiano</th></tr>
<tr><td>Dijo que vendría</td><td>Disse que viria</td><td>Ha detto che <b>sarebbe venuto</b></td></tr>
<tr><td>Pensaba que lo harías</td><td>Pensava que você faria</td><td>Pensavo che l'<b>avresti fatto</b></td></tr>
</table></div>
<p>Em italiano, o futuro visto do passado é <b>sempre condicional passado</b>, mesmo que a ação ainda vá acontecer. "Ha detto che verrebbe" é o erro mais típico de hispanófonos e lusófonos neste nível.</p>
`,

{
id:8, lvl:'B1 → B2', band:1,
title:'Congiuntivo presente e passato',
sub:'Penso che sia: onde o italiano se afasta do espanhol e do português.',
focus:'congiuntivo presente e passato: forme, verbi di opinione (pensare, credere, sembrare), volontà, emozione, espressioni impersonali, congiunzioni (benché, affinché, purché, a meno che, prima che), relative e superlativi',
lesson:`
<p class="lead">As formas não assustam (são quase as do <i>presente de subjuntivo</i> espanhol). O que muda é <b>quando</b> usar: o italiano usa congiuntivo depois de <b>opinião</b>, onde nós usamos indicativo.</p>
<div class="tw"><table class="tbl">
<tr><th>Espanhol</th><th>Português</th><th>Italiano</th></tr>
<tr><td>Creo que <b>es</b> verdad</td><td>Acho que <b>é</b> verdade</td><td>Credo che <b>sia</b> vero</td></tr>
<tr><td>Me parece que <b>tiene</b> razón</td><td>Parece-me que <b>tem</b> razão</td><td>Mi sembra che <b>abbia</b> ragione</td></tr>
</table></div>
<h3>Formas</h3>
<p>-are → <b>-i</b> (parli, parli, parli, parliamo, parliate, parlino); -ere/-ire → <b>-a</b> (prenda, senta, finisca… prendiamo, prendiate, prendano). As três pessoas do singular são iguais, então use o pronome se precisar: <i>Penso che <b>tu</b> abbia ragione</i>.</p>
<div class="chips">essere: sia · avere: abbia · fare: faccia · andare: vada · dire: dica · venire: venga · potere: possa · volere: voglia · dovere: debba · sapere: sappia · stare: stia · dare: dia · uscire: esca</div>
<p><b>Congiuntivo passato</b>: <i>abbia/sia</i> + particípio: <i>Penso che sia già partita.</i></p>
<h3>Quando usar</h3>
<ul class="dots">
<li>Opinião e crença: <i>penso, credo, ritengo, immagino, mi sembra, suppongo che…</i></li>
<li>Vontade e pedido: <i>voglio, preferisco, chiedo che…</i></li>
<li>Emoção: <i>sono contenta, mi dispiace, ho paura che…</i></li>
<li>Dúvida e esperança: <i>dubito, spero, non so se…</i></li>
<li>Impessoais: <i>bisogna, è necessario, è importante, è meglio, è possibile che…</i></li>
<li>Conjunções: <i>benché, sebbene, nonostante, affinché, perché</i> (= para que), <i>purché, a condizione che, a meno che (non), prima che, senza che</i>.</li>
<li>Relativas de busca e superlativos: <i>Cerco qualcuno che <b>sappia</b> il tedesco. È il libro più bello che <b>abbia</b> mai letto.</i></li>
</ul>
<h3>Quando NÃO usar</h3>
<p><i>Secondo me <b>è</b>…</i> · <i>So che <b>è</b>…</i> · <i>Sono sicura che <b>è</b>…</i> · <i>È vero / è chiaro che <b>è</b>…</i> · <i>Anche se <b>piove</b>…</i> (anche se = indicativo; benché = congiuntivo).</p>
<div class="trap"><span class="pen">Attenzione!</span> Mesmo sujeito → <b>di + infinitivo</b>: <i>Penso <b>di</b> avere ragione</i> (não "penso che io abbia"). <i>Spero di vederti presto.</i></div>
`,

text:`<p>Gentile direttore,<br>si dice spesso che i giovani italiani non leggano più. Mi sembra che questa affermazione sia ingiusta, o almeno troppo semplice. Sono un'insegnante di liceo e vedo ogni giorno ragazzi che [[divorano|devoram]] saghe fantasy, fumetti giapponesi e romanzi scoperti sui social. Non credo che leggere un manga sia meno nobile che leggere un classico; penso piuttosto che la scuola debba partire da lì per arrivare, con pazienza, anche a Calvino e a Morante.</p>

<div class="plus"><span class="pen">Vantaggio enorme</span> O congiuntivo imperfetto corresponde quase perfeitamente ao <i>-ra/-se</i> espanhol e ao imperfeito do subjuntivo português: <i>fuera / fosse → fosse</i>, <i>tuviera / tivesse → avessi</i>, <i>viniera / viesse → venissi</i>.</div>
<h3>Formas</h3>
<p>-<b>assi</b>, -<b>essi</b>, -<b>issi</b>: <i>parlassi, parlassi, parlasse, parlassimo, parlaste, parlassero</i>. Irregulares: <i>essere → fossi</i>, <i>dare → dessi</i>, <i>stare → stessi</i>, <i>fare → facessi</i>, <i>dire → dicessi</i>, <i>bere → bevessi</i>, <i>tradurre → traducessi</i>.</p>
<p><b>Congiuntivo trapassato</b>: <i>avessi/fossi</i> + particípio: <i>Pensavo che fosse già partito.</i></p>
<h3>Concordância dos tempos</h3>
<div class="tw"><table class="tbl">
<tr><th>verbo principal</th><th>simultâneo</th><th>anterior</th><th>posterior</th></tr>
<tr><td><b>presente / futuro</b><br><i>Penso che…</i></td><td>…sia stanca</td><td>…sia stata stanca</td><td>…sarà stanca</td></tr>
<tr><td><b>passado</b><br><i>Pensavo che…</i></td><td>…fosse stanca</td><td>…fosse stata stanca</td><td>…<b>sarebbe stata</b> stanca</td></tr>
<tr><td><b>condicional</b><br><i>Vorrei che…</i></td><td>…tu venissi</td><td>…tu fossi venuta</td><td>—</td></tr>
</table></div>
<p>Com <i>vorrei, preferirei, mi piacerebbe</i> o congiuntivo é <b>sempre imperfetto</b>: <i>Vorrei che tu <b>venissi</b></i> (nunca "venga").</p>
<h3>Expressões fixas</h3>
<ul class="dots">
<li><b>Magari</b> + imperfetto = tomara/quem dera: <i>Magari fosse vero!</i></li>
<li><b>Come se</b> + imperfetto/trapassato: <i>Parla come se sapesse tutto. Mi guardava come se non mi avesse mai visto.</i></li>
<li>Pergunta indireta no passado: <i>Mi ha chiesto se <b>avessi</b> tempo</i> (registro cuidado; coloquial: <i>se avevo</i>).</li>
</ul>
<div class="trap"><span class="pen">Attenzione!</span> O <i>-ra</i> espanhol às vezes vale como mais-que-perfeito ou condicional (<i>quisiera</i>). Em italiano não: <i>vorrei</i> é condicional, <i>volessi</i> só congiuntivo.</div>
`,

{
id:11, lvl:'B2 → C1', band:2,
title:'Si, passivo, gerundio e participio',
sub:'O italiano dos textos formais: va compilato, si vendono, finita la cena…',
focus:'si impersonale (ci si alza), si passivante, passivo con essere, venire e andare (va fatto), gerundio presente e passato, participio passato assoluto',
lesson:`
<h3>Si impersonale e si passivante</h3>
<ul class="dots">
<li><b>Impessoal</b> (verbo na 3ª sing.): <i>In Italia si mangia tardi. Si vive bene qui.</i></li>
<li>Com verbos reflexivos vira <b>ci si</b>: <i>La domenica ci si alza tardi.</i></li>
<li>Com <i>essere</i> + adjetivo, o adjetivo vai ao <b>plural</b>: <i>Quando si è giovani, si è impazienti.</i></li>
<li><b>Passivante</b>: o verbo concorda com a coisa: <i>Si vende casa / Si vendono case</i> (= ES <i>se venden</i>, PT <i>vendem-se</i>). Nos tempos compostos, <i>essere</i> + concordância: <i>Si sono vendute molte case.</i></li>
</ul>
<h3>Três passivas</h3>
<div class="tw"><table class="tbl">
<tr><th>auxiliar</th><th>valor</th><th>exemplo</th></tr>
<tr><td><b>essere</b></td><td>neutro, todos os tempos</td><td><i>La legge è stata approvata ieri.</i></td></tr>
<tr><td><b>venire</b></td><td>enfatiza a ação; só tempos simples</td><td><i>La porta viene chiusa alle venti.</i></td></tr>
<tr><td><b>andare</b></td><td>obrigação (= deve ser)</td><td><i>Il modulo va compilato in stampatello.</i></td></tr>
</table></div>
<div class="trap"><span class="pen">Attenzione!</span> <b>Andare + particípio</b> não existe em espanhol nem em português, e é onipresente em instruções italianas: <i>Il vino va servito fresco. Le domande vanno presentate entro il 30.</i> Também = "perder-se": <i>La lettera è andata persa.</i></div>
<h3>Gerúndio</h3>
<p>Causa, modo, tempo, condição: <i>Essendo stanca, sono rimasta a casa. Studiando si impara. Volendo, si può fare.</i> Gerúndio passado: <i>Avendo finito, sono uscita. Essendo arrivati tardi, abbiamo perso l'inizio.</i> Pronomes colados: <i>vedendolo, dicendoglielo</i>.</p>
<h3>Particípio absoluto (C1)</h3>
<p>Como o PT <i>Terminado o jantar, saímos</i>: <i><b>Finita</b> la cena, siamo usciti. <b>Arrivati</b> a casa, abbiamo dormito.</i> O particípio concorda com o seu "sujeito": <i>Saputa la notizia</i> (la notizia → saputa).</p>
`,

text:`<p>Il Parmigiano Reggiano si produce solo in una zona ben precisa, tra le province di Parma, Reggio Emilia, Modena, Bologna (a sinistra del fiume Reno) e Mantova (a destra del Po). Il latte viene raccolto due volte al giorno e deve essere lavorato entro poche ore: non si possono aggiungere conservanti né additivi.</p>

lesson:`
<h3>Discurso indireto (verbo introdutor no passado)</h3>

{

title:'Pronomi relativi',
sub:'Che, cui, il quale, il cui, chi, ciò che: ligar frases como um nativo.',
focus:'pronomi relativi: che, cui (con cui, di cui, in cui), il quale / la quale, il cui (possessivo relativo), chi, quello che / ciò che, il che',
lesson:`
<p class="lead">Em português e espanhol, <i>que</i> vai depois de quase qualquer preposição (<i>a pessoa com que falei</i>). Em italiano não: depois de preposição, <b>che</b> vira <b>cui</b>.</p>
<div class="tw"><table class="tbl">
<tr><th>pronome</th><th>uso</th><th>exemplo</th></tr>
<tr><td><b>che</b></td><td>sujeito ou objeto direto, invariável</td><td><i>Il ragazzo <b>che</b> lavora con me. Il libro <b>che</b> leggo.</i></td></tr>
<tr><td><b>cui</b></td><td>depois de preposição</td><td><i>L'amica <b>con cui</b> esco. Il film <b>di cui</b> ti ho parlato. La città <b>in cui</b> vivo.</i></td></tr>
<tr><td><b>cui</b> sozinho</td><td>= a cui (registro cuidado)</td><td><i>La persona <b>cui</b> ho scritto.</i></td></tr>
<tr><td><b>il quale, la quale, i quali, le quali</b></td><td>formal; evita ambiguidade; com preposição articulada</td><td><i>La sorella di Marco, <b>la quale</b> vive a Parigi… Il progetto <b>al quale</b> lavoro.</i></td></tr>
<tr><td><b>il cui, la cui, i cui, le cui</b></td><td>= cujo/cuyo; o artigo concorda com a coisa possuída</td><td><i>La scrittrice <b>i cui</b> romanzi leggo. La casa <b>le cui</b> finestre danno sul mare.</i></td></tr>
<tr><td><b>chi</b></td><td>= quem / aquele que, verbo no singular</td><td><i><b>Chi</b> dorme non piglia pesci.</i></td></tr>
<tr><td><b>quello che / ciò che</b></td><td>= o que</td><td><i>Non capisco <b>quello che</b> dici.</i></td></tr>
<tr><td><b>il che</b></td><td>= o que (retoma a frase inteira)</td><td><i>È arrivato tardi, <b>il che</b> mi ha irritato.</i></td></tr>
<tr><td><b>dove</b></td><td>= in cui, para lugares</td><td><i>La città <b>dove</b> sono nata.</i></td></tr>
</table></div>
<div class="trap"><span class="pen">Attenzione!</span> "Com que", "de que", "em que" → <b>con cui, di cui, in cui</b>. Nunca "con che". E "o que" no começo de frase é <b>quello che / ciò che</b>, não "il che": <i>Quello che dici è vero</i>.</div>
<div class="plus"><span class="pen">Dica</span> <i>Per cui</i> no fim de um raciocínio é coloquial para "por isso": <i>Ero stanca, per cui sono andata a letto.</i> Em texto formal use <i>perciò</i> ou <i>pertanto</i>.</div>
`,

id:15, lvl:'B2 → C1', band:2,
title:'Causativo e verbi pronominali',
sub:'Mi faccio tagliare i capelli, me la cavo, non me la sento, ce l\'ho con te.',
focus:'fare + infinito (causativo), lasciare + infinito, verbi pronominali (cavarsela, prendersela, sentirsela, passarsela, godersela, smetterla, avercela con qualcuno, farcela)',
lesson:`
<h3>Fare + infinitivo: mandar fazer</h3>
<p><i>Faccio riparare la macchina</i> = mando consertar o carro. <i>Mi faccio tagliare i capelli</i> = corto o cabelo (no cabeleireiro).</p>
<div class="trap"><span class="pen">Attenzione!</span> Em português e espanhol, "corto o cabelo" / "me corto el pelo" serve mesmo quando outra pessoa corta. Em italiano, <i>mi taglio i capelli</i> significa que você mesma corta. No cabeleireiro: <b>mi faccio tagliare</b>.</div>
<ul class="dots">
<li>Quem executa a ação vem com <b>a</b> ou <b>da</b>: <i>Ho fatto leggere la lettera <b>a</b> Marco. Mi faccio aiutare <b>da</b> mia sorella.</i></li>
<li>Pronomes vão antes de <i>fare</i> (ou colados no imperativo): <i>Te lo faccio sapere. Fallo entrare!</i></li>
<li><b>Lasciare</b> + infinitivo = deixar: <i>Lasciami parlare! Non lasciarti convincere.</i> (sem preposição!)</li>
</ul>
<h3>Verbos pronominais do dia a dia</h3>
<div class="tw"><table class="tbl">
<tr><td><b>cavarsela</b></td><td>virar-se, se sair</td><td><i>Me la cavo con l'inglese. Te la sei cavata bene!</i></td></tr>
<tr><td><b>farcela</b></td><td>conseguir</td><td><i>Ce l'ho fatta! Non ce la faccio più.</i></td></tr>
<tr><td><b>prendersela</b></td><td>ofender-se, ficar chateada</td><td><i>Non prendertela, scherzavo. Se l'è presa.</i></td></tr>
<tr><td><b>avercela con</b></td><td>estar com raiva de alguém</td><td><i>Perché ce l'hai con me?</i></td></tr>
<tr><td><b>sentirsela</b></td><td>sentir-se capaz, ter coragem</td><td><i>Non me la sento di guidare di notte.</i></td></tr>
<tr><td><b>passarsela</b></td><td>estar levando a vida</td><td><i>Come te la passi?</i></td></tr>
<tr><td><b>godersela</b></td><td>aproveitar</td><td><i>Siamo in vacanza: godiamocela!</i></td></tr>
<tr><td><b>smetterla / finirla</b></td><td>parar com isso</td><td><i>Smettila! Finiscila di lamentarti.</i></td></tr>
<tr><td><b>andarsene</b></td><td>ir embora</td><td><i>Me ne vado.</i></td></tr>
</table></div>
<p>Nos tempos compostos usam <b>essere</b> e o particípio concorda com o <i>la</i> (feminino): <i>me la sono cavat<b>a</b>, se l'è pres<b>a</b></i> — mesmo quando quem fala é homem.</p>
`,

text:`<p>Quando sono arrivata a Bologna per l'Erasmus, non parlavo quasi italiano. I primi giorni me la sono cavata con lo spagnolo e i gesti, ma presto ho capito che non bastava. Al supermercato una signora se l'è presa perché le avevo «rubato» il posto nella fila; io non avevo capito niente e lei ce l'ha avuta con me per tutta la settimana, ogni volta che ci incontravamo sulle scale.</p>

{

title:'Registro formale e nominalizzazione',
sub:'Escrever como num e-mail institucional, num relatório ou num jornal.',
focus:'nominalizzazione (decidere → la decisione), sinonimi formali (effettuare, svolgere, comportare, fornire, disporre di), formule della lettera formale (con la presente, resto in attesa di un Suo riscontro), Lei con maiuscola',
lesson:`
<p class="lead">No C1 o que muda não é a gramática, é o <b>registro</b>: transformar verbos em substantivos, trocar verbos genéricos por precisos e dominar as fórmulas da escrita formal.</p>
<h3>Nominalização</h3>
<p><i>Il governo ha deciso di aumentare le tasse</i> → <i>La <b>decisione</b> del governo di aumentare le tasse</i>.</p>
<div class="chips">arrivare → l'arrivo · partire → la partenza · aumentare → l'aumento · ridurre → la riduzione · crescere → la crescita · scegliere → la scelta · sviluppare → lo sviluppo · chiudere → la chiusura · pagare → il pagamento · perdere → la perdita · vendere → la vendita · risolvere → la soluzione · analizzare → l'analisi · richiedere → la richiesta · rinviare → il rinvio</div>
<h3>Verbos genéricos → formais</h3>
<div class="tw"><table class="tbl">
<tr><th>coloquial</th><th>formal</th><th>exemplo</th></tr>
<tr><td>fare</td><td>effettuare, svolgere, compiere, redigere</td><td><i>effettuare un pagamento, svolgere un'attività, redigere un verbale</i></td></tr>
<tr><td>dire</td><td>affermare, dichiarare, sostenere, comunicare</td><td><i>Il ministro ha dichiarato che…</i></td></tr>
<tr><td>avere</td><td>possedere, disporre di</td><td><i>L'azienda dispone di trenta dipendenti.</i></td></tr>
<tr><td>dare</td><td>fornire, conferire, rilasciare</td><td><i>fornire informazioni, rilasciare un certificato</i></td></tr>
<tr><td>usare</td><td>impiegare, utilizzare, avvalersi di</td><td><i>Ci avvaliamo di consulenti esterni.</i></td></tr>
<tr><td>causare</td><td>comportare, determinare, provocare</td><td><i>Il progetto comporta costi elevati.</i></td></tr>
<tr><td>mostrare</td><td>evidenziare, illustrare</td><td><i>I dati evidenziano un calo.</i></td></tr>
</table></div>
<div class="trap"><span class="pen">Falso amico</span> <b>comportare</b> = implicar, acarretar (não "comportar-se", que é <i>comportarsi</i>). <b>Riscontro</b> = resposta, retorno.</div>
<h3>Fórmulas de carta e e-mail formal</h3>
<div class="tw"><table class="tbl">
<tr><th>abertura</th><td>Gentile Dottoressa Bianchi, · Egregio Direttore, · Spettabile Ditta / Spett.le Ufficio</td></tr>
<tr><th>motivo</th><td>Con la presente desidero… · In riferimento alla Sua email del… · Le scrivo in merito a…</td></tr>
<tr><th>pedido</th><td>Le sarei grata se potesse… · Vi chiedo cortesemente di…</td></tr>
<tr><th>fecho</th><td>Resto in attesa di un Suo cortese riscontro. · La ringrazio anticipatamente. · Distinti saluti / Cordiali saluti</td></tr>
</table></div>
<p>No registro formal, os pronomes de <b>Lei</b> costumam ir com maiúscula, inclusive colados: <i>La ringrazio, comunicarLe, la Sua richiesta</i>. Para empresas: <i>Voi, Vostro</i>.</p>
`,

text:`<p><b>Oggetto:</b> Reclamo per mancata consegna — ordine n. 48213</p>
<p>Gentile Servizio Clienti,<br>con la presente desidero segnalare la mancata consegna dell'ordine in oggetto, effettuato il 2 ottobre e regolarmente pagato con carta di credito. Al momento dell'acquisto, sul Vostro sito era indicata una consegna entro cinque giorni lavorativi. Ad oggi, a distanza di oltre tre settimane, non ho ricevuto né il prodotto né alcuna comunicazione [[in merito al|a respeito do]] ritardo.</p>

lesson:`
<p class="lead">O italiano se lê quase exatamente como se escreve. Aprendendo uma dúzia de regras você consegue ler em voz alta qualquer palavra, e é aí que começa a melodia da língua.</p>
<h3>Os sons que mudam</h3>
<div class="tw"><table class="tbl">
<tr><th>escrita</th><th>som</th><th>como em…</th><th>exemplos</th></tr>
<tr><td><b>ce, ci</b></td><td>"tch"</td><td>tchau</td><td><i>cena, ciao, cinema, dolce</i></td></tr>
<tr><td><b>che, chi</b></td><td>"k"</td><td>quero</td><td><i>che, chiave, Michele, pochi</i></td></tr>
<tr><td><b>ca, co, cu</b></td><td>"k"</td><td>casa</td><td><i>casa, come, cuore</i></td></tr>
<tr><td><b>ge, gi</b></td><td>"dj"</td><td>"dia" no Rio</td><td><i>gelato, giorno, Giulia</i></td></tr>
<tr><td><b>ghe, ghi</b></td><td>"g"</td><td>guerra</td><td><i>spaghetti, laghi</i></td></tr>
<tr><td><b>gli</b></td><td>"lh"</td><td>filho</td><td><i>figlio, famiglia, moglie</i></td></tr>
<tr><td><b>gn</b></td><td>"nh"</td><td>banho</td><td><i>gnocchi, lasagna, bagno</i></td></tr>
<tr><td><b>sce, sci</b></td><td>"ch"</td><td>chá</td><td><i>pesce, sciare, uscita</i></td></tr>
<tr><td><b>sche, schi</b></td><td>"sk"</td><td>—</td><td><i>scherzo, schiena</i></td></tr>
<tr><td><b>z, zz</b></td><td>"ts" ou "dz"</td><td>—</td><td><i>pizza</i> (ts), <i>zero</i> (dz)</td></tr>
<tr><td><b>h</b></td><td>muda</td><td>hora</td><td><i>ho, hai, ha, hanno</i></td></tr>
</table></div>
<p>Em <i>ciao, giorno, giallo</i> o <b>i</b> só serve para dar o som "tch"/"dj": não se pronuncia. Diz-se "tchao", "djorno".</p>
<div class="trap"><span class="pen">Attenzione, brasiliana!</span> No italiano as vogais finais são sempre claras: <i>latte</i> é "lát-te", nunca "látchi"; <i>sette</i> é "sét-te". E <b>di</b>, <b>ti</b> nunca viram "dji", "tchi": <i>dico</i> = "dí-ko", <i>tipo</i> = "tí-po".</div>
<h3>Consoantes duplas</h3>
<p>As <i>doppie</i> se pronunciam mais longas e mudam o significado: <i>nono</i> (nono) ≠ <i>nonno</i> (avô) · <i>sete</i> (sede) ≠ <i>sette</i> (sete) · <i>caro</i> ≠ <i>carro</i> · <i>pena</i> ≠ <i>penna</i> (caneta).</p>
<h3>O acento</h3>
<p>A maioria das palavras é paroxítona: <i>a-MI-co, par-LA-re</i>. O acento gráfico só aparece na última sílaba: <i>città, perché, caffè, così</i>. E <b>è</b> (é, verbo) ≠ <b>e</b> (e, conjunção).</p>
<h3>Saudações</h3>
<div class="tw"><table class="tbl">
<tr><th>informal (tu)</th><th>formal (Lei)</th></tr>
<tr><td><i>Ciao!</i> (oi / tchau)</td><td><i>Buongiorno</i> (até o começo da tarde) · <i>Buonasera</i></td></tr>
<tr><td><i>Come stai?</i></td><td><i>Come sta?</i></td></tr>
<tr><td><i>Come ti chiami?</i></td><td><i>Come si chiama?</i></td></tr>
<tr><td><i>A presto! Ci vediamo!</i></td><td><i>Arrivederci! ArrivederLa!</i></td></tr>
</table></div>
<p><i>Buonanotte</i> só para ir dormir. Para se apresentar: <i>Mi chiamo Ana. Sono brasiliana, di Recife. Piacere!</i> Resposta: <i>Piacere mio!</i></p>
<div class="plus"><span class="pen">Vantaggio</span> O <b>Lei</b> formal usa o verbo na 3ª pessoa, exatamente como o nosso "você" ou "o senhor": <i>Lei come sta?</i> = Como o senhor está?</div>
<div class="trap"><span class="pen">Parole utili</span> <i>grazie</i> (obrigada) · <i>prego</i> (de nada / por favor, entre) · <i>per favore</i> (por favor) · <i>scusa / scusi</i> (desculpa / com licença) · <i>sì / no</i> · <i>va bene</i> (tudo bem).</div>

lesson:`
<p class="lead">Os dois verbos mais importantes. Em italiano, <b>essere</b> faz o papel de "ser" e quase sempre de "estar", e <b>avere</b> é "ter".</p>
<div class="tw"><table class="tbl">
<tr><th></th><th>essere</th><th>avere</th></tr>
<tr><th>io</th><td>sono</td><td>ho</td></tr>
<tr><th>tu</th><td>sei</td><td>hai</td></tr>
<tr><th>lui / lei / Lei</th><td>è</td><td>ha</td></tr>
<tr><th>noi</th><td>siamo</td><td>abbiamo</td></tr>
<tr><th>voi</th><td>siete</td><td>avete</td></tr>
<tr><th>loro</th><td>sono</td><td>hanno</td></tr>
</table></div>
<p>O <b>h</b> é mudo e só serve para distinguir: <i>ho</i> (tenho) / <i>o</i> (ou) · <i>ha</i> (tem) / <i>a</i> (a, preposição) · <i>hanno</i> (têm) / <i>anno</i> (ano). Como no espanhol, o pronome sujeito costuma ficar de fora: <i>Sono stanca</i> = Estou cansada.</p>
<h3>Adjetivos: concordância</h3>
<div class="tw"><table class="tbl">
<tr><th></th><th>masc. sing.</th><th>fem. sing.</th><th>masc. pl.</th><th>fem. pl.</th></tr>
<tr><td>em -o</td><td>alto</td><td>alta</td><td>alti</td><td>alte</td></tr>
<tr><td>em -e</td><td>gentile</td><td>gentile</td><td>gentili</td><td>gentili</td></tr>
</table></div>
<p><b>Nacionalidades:</b> brasiliano/a, italiano/a, spagnolo/a, argentino/a, americano/a, tedesco/a (alemão) · e em -e: portoghese, francese, inglese, cinese, giapponese.</p>
<p><b>Profissões:</b> <i>Che lavoro fai?</i> → <i>Sono insegnante / medico / ingegnere / studentessa / programmatrice</i> (sem artigo), ou <i>Faccio la programmatrice</i> (com artigo).</p>
<h3>Expressões com avere</h3>
<div class="chips">ho fame (estou com fome) · ho sete (sede) · ho freddo (frio) · ho caldo (calor) · ho sonno (sono) · ho fretta (pressa) · ho paura (medo) · ho ragione (tenho razão) · ho bisogno di… (preciso de…)</div>
<div class="trap"><span class="pen">Attenzione!</span> A idade é com <b>avere</b>: <i>Ho trent'anni</i> (nunca "sono trent'anni"). E "estar com fome" é <i>avere fame</i>: nada de "sono con fame".</div>
<div class="plus"><span class="pen">Per chi parla spagnolo</span> Aqui o espanhol ajuda: <i>tengo hambre → ho fame</i>, <i>tengo frío → ho freddo</i>. O "estar" (<i>stare</i>) aparece em poucas expressões: <i>Come stai? Sto bene. Sto a casa.</i></div>
`,

lesson:`
<p class="lead">Quase todo substantivo italiano termina em vogal, e essa vogal diz o gênero e o número. O plural não leva <b>-s</b>: a vogal final muda.</p>
<div class="tw"><table class="tbl">
<tr><th>singular</th><th>plural</th><th>exemplo</th></tr>
<tr><td>-o (masc.)</td><td>-i</td><td><i>il libro → i libri</i></td></tr>
<tr><td>-a (fem.)</td><td>-e</td><td><i>la casa → le case</i></td></tr>
<tr><td>-e (masc. ou fem.)</td><td>-i</td><td><i>il fiore → i fiori · la chiave → le chiavi</i></td></tr>
<tr><td>acento final ou consoante</td><td>não muda</td><td><i>la città → le città · il caffè → i caffè · il bar → i bar</i></td></tr>
</table></div>
<p><b>Ortografia:</b> -ca/-ga → -che/-ghe (<i>l'amica → le amiche</i>); -co/-go → -chi/-ghi (<i>il gioco → i giochi</i>), com exceções como <i>l'amico → gli amici</i>.</p>
<p><b>Irregulares frequentes:</b> <i>l'uomo → gli uomini · la mano → le mani · l'uovo → le uova</i>.</p>
<h3>Artigos (versão simples)</h3>
<div class="tw"><table class="tbl">
<tr><th></th><th>definido sing.</th><th>definido pl.</th><th>indefinido</th></tr>
<tr><td>masc. (maioria)</td><td>il libro</td><td>i libri</td><td>un libro</td></tr>
<tr><td>masc. + s+consoante, z</td><td>lo studente, lo zaino</td><td>gli studenti</td><td>uno studente</td></tr>
<tr><td>masc. + vogal</td><td>l'amico</td><td>gli amici</td><td>un amico</td></tr>
<tr><td>fem.</td><td>la casa · l'amica</td><td>le case · le amiche</td><td>una casa · un'amica</td></tr>
</table></div>
<p>Na unidade 1 você vai ver os artigos em detalhe, com as preposições.</p>
<div class="trap"><span class="pen">Gênero diferente!</span> <i>il fiore</i> (a flor) · <i>il ponte</i> (a ponte) · <i>il colore</i> (a cor) · <i>il dolore</i> (a dor) · <i>il latte</i> · <i>il sale</i> (ES <i>la sal</i>) · <i>il miele</i> (ES <i>la miel</i>) · <i>la fine</i> (o fim). Como no português, <i>il problema, il programma, il cinema</i> são masculinos.</div>
